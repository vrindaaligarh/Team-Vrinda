// ---------- Attendance (owners and MANSI): PagarBook punches -> late, half day, leave, fines, bonus ----------
// Rules (owner, new timings from 25 Oct 2026; counted from 20 Oct). Moved over from the ChatGPT Speed Desk unchanged:
// - First punch = entry, last punch = exit. No punch on a day that has punches = on leave.
// - Grace from 25 Oct: girls 10 min, others 5 min. Wednesday entry: girls 9:15, everyone else 9:00.
// - Late more than 1 hour after the in-time = half day. Last punch before 7:00 PM (6:50 PM for girls from 25 Oct) = half day,
//   except IRFAN, HIMANSHU, TALHA and ROCKY (no fixed exit). Only one punch after that time = half day (no exit punch).
// - First 3 lates in a month are free, Rs 100 for each late after that. No late all month = Rs 300 bonus.
// - Leave without informing = Rs 200 (pending review keeps Rs 200 until approved as informed).
// - Breaks = middle OUT/IN pairs; flagged over 50 min (65 on Wednesday) from 25 Oct, no fine. MANNU, HIMANSHU, ROCKY not checked.
const ATT_START = '2026-10-20', ATT_POLICY = '2026-10-25', ATT_HALF_EXIT = '19:00';
const ATT_BREAK_SKIP = new Set(['MANNU', 'HIMANSHU', 'ROCKY']);
const attShift = (inTime, outTime, names, extra = {}) => names.map((n) => [n, { inTime, outTime, ...extra }]);
const ATT_SCHEDULE = new Map([
  ...attShift('10:00', '19:30', ['AZEEM', 'ABHAY', 'HAMZA', 'SAFFAN', 'SUFIYAN', 'NAVED']),
  ...attShift('10:00', '19:30', ['OWAIS'], { left: '2026-10-20' }), // has left: never marked on leave, counted only on days with punches
  ...attShift('10:00', '19:30', ['ADNAN', 'RAJ'], { start: '2026-10-24' }),
  ...attShift('10:00', '19:45', ['ANAS', 'FARAZ', 'JUNAID', 'REHAN', 'ZUHAIB', 'SAIF']),
  ...attShift('10:00', null, ['ARUN', 'FARHAN', 'HAYYUL', 'MUKUL', 'SONU', 'VICKY']),
  ...attShift('10:15', '19:25', ['BHAKTI', 'DIYA', 'MANSI', 'NEHA', 'POOJA', 'RIYA', 'SIYA', 'SHEBI', 'SUMAN'], { girl: true }),
  ...attShift('10:15', null, ['AFZAL', 'RIZWAN', 'YASH']),
  ...attShift('10:30', null, ['HIMANSHU', 'IRFAN', 'ROCKY', 'TALHA'], { flexibleExit: true }),
]);
// PagarBook name -> roster name. DORI is not tracked.
const ATT_ALIASES = { 'NEHA SHARMA': 'NEHA', 'MANSI SHARMA': 'MANSI', 'PRIYANSHI': 'DIYA', 'PRIYANSHI SHARMA': 'SIYA', 'HIMANSHU SHARMA': 'HIMANSHU', 'MUKUL KUMAR': 'MUKUL', 'REHAN ALI': 'REHAN', 'RIZWAN MALIK': 'RIZWAN' };
const ATT_IGNORED = new Set(['DORI']);
const attNorm = (v) => String(v ?? '').trim().replace(/\s+/g, ' ').toUpperCase();
const attRoster = (raw) => { const n = attNorm(raw); return ATT_ALIASES[n] || n; };
const attMins = (t) => { const m = String(t).match(/^([01]?\d|2[0-3]):([0-5]\d)/); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
const attHm = (m) => { if (m == null) return '—'; const h = Math.floor(m / 60), mm = m % 60; return (h % 12 || 12) + ':' + String(mm).padStart(2, '0') + ' ' + (h >= 12 ? 'PM' : 'AM'); };
const attSpan = (m) => m < 60 ? m + ' min' : Math.floor(m / 60) + ' hr' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
const attTitle = (n) => n.split(' ').map((w) => w.charAt(0) + w.slice(1).toLowerCase()).join(' ');
const attWeekday = (d) => new Date(d + 'T12:00:00Z').getUTCDay();
const attFmt = (d, o = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) => new Intl.DateTimeFormat('en-IN', { ...o, timeZone: 'UTC' }).format(new Date(d + 'T12:00:00Z'));
const attShiftDay = (d, n) => new Date(Date.parse(d + 'T12:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const attNow = () => { const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date()).map((x) => [x.type, x.value])); return { date: p.year + '-' + p.month + '-' + p.day, minutes: (Number(p.hour) % 24) * 60 + Number(p.minute) }; };
const attHasPunch = (s) => String(s || '').split(';').some((t) => attMins(t.trim()) != null);
let attData = { dates: {}, revisions: {}, approvals: [], uploads: [], lateOk: [], halfOk: [] }, attBusy = false, attMsg = '';
const attLateDecision = (date, name) => (attData.lateOk || []).find((a) => a.date === date && a.name === name);
const attLateOk = (date, name) => { const a = attLateDecision(date, name); return a && (a.status || 'approved') === 'approved' ? a : null; };
const attHalfDecision = (date, name) => (attData.halfOk || []).find((a) => a.date === date && a.name === name);
// Approve / Not approved buttons (or the saved choice with Undo) for a late (kind 'late') or a half day (kind 'half').
function attDecisionCell(kind, name, dec, ok) {
  const dis = attBusy ? 'disabled' : '', a = `data-att-dec="${kind}" data-name="${esc(name)}"`;
  const undo = dec ? ` <button class="btn ghost small" ${a} data-st="" ${dis}>Undo</button><small>${esc(dec.by || '')} · ${fmtFull(dec.at)}</small>` : '';
  if (ok) return `<span class="pill green">Approved</span>${undo}`;
  if (dec) return `<span class="pill red">Not approved</span>${undo}`;
  return `<button class="btn small green" ${a} data-st="approved" ${dis}>Approve ${kind === 'late' ? 'late' : 'half day'}</button> <button class="btn small ghost del" ${a} data-st="rejected" ${dis}>Not approved</button>`;
}

const attApproval = (date, name) => attData.approvals.find((a) => a.date === date && a.name === name && a.dayRevision === attData.revisions[date]);
const attInformed = (date, name) => (attApproval(date, name) || {}).status === 'approved';
const attParse = (stamps) => String(stamps || '').split(';').map((s) => attMins(s.trim())).filter((v) => v != null).sort((a, b) => a - b);
const attInTime = (name, date) => { const s = ATT_SCHEDULE.get(name); if (!s) return null; if (attWeekday(date) === 3) return attMins(s.girl ? '09:15' : '09:00'); return attMins(s.inTime); };

// One day for every person on the timing list.
function attClassifyDay(date) {
  const rows = attData.dates[date] || [], byName = new Map(), unknown = new Set();
  for (const r of rows) {
    const n = attRoster(r.name); if (ATT_IGNORED.has(n)) continue;
    if (!ATT_SCHEDULE.has(n)) { if (String(r.stamps).trim()) unknown.add(attNorm(r.name)); continue; }
    const prev = byName.get(n), times = attParse(r.stamps);
    byName.set(n, { raw: prev ? prev.raw + '; ' + r.stamps : r.stamps, duplicate: !!prev, times: prev ? [...prev.times, ...times].sort((a, b) => a - b) : times });
  }
  const now = attNow(), people = [];
  for (const [name, s] of ATT_SCHEDULE) {
    if (s.start && date < s.start) { people.push({ name, status: 'not-started' }); continue; }
    const rec = byName.get(name), times = (rec && rec.times) || [];
    if (s.left && date >= s.left && !times.length) { people.push({ name, status: 'left' }); continue; }
    const updated = date >= ATT_POLICY, grace = updated ? (s.girl ? 10 : 5) : 0;
    const due = attInTime(name, date), outDue = name === 'SUMAN' && updated ? attMins('19:00') : s.outTime ? attMins(s.outTime) : null;
    const allowedExit = s.flexibleExit ? null : updated && s.girl && outDue != null ? outDue - 10 : attMins(ATT_HALF_EXIT);
    const halfExit = attMins(ATT_HALF_EXIT) - (updated && s.girl ? 10 : 0);
    if (!times.length) { people.push({ name, status: 'leave', due, outDue, grace, allowedExit, raw: (rec && rec.raw) || '' }); continue; }
    const first = times[0], last = times.length > 1 ? times[times.length - 1] : null, lateBy = Math.max(0, first - due), reasons = [];
    // Approved late: not counted anywhere (no late, no late fine, no "more than 1 hour late" half day).
    const lateExcused = lateBy > grace && !!attLateOk(date, name);
    if (lateBy > 60 && !lateExcused) reasons.push('Late by more than 1 hour (' + attSpan(lateBy) + ')');
    let exitNote = '';
    if (date === now.date && now.minutes < halfExit && (last == null || last < halfExit)) exitNote = 'Day not over yet';
    else if (last == null) reasons.push('No exit punch (only one punch at ' + attHm(first) + ')');
    else if (!s.flexibleExit && last < halfExit) reasons.push('Left at ' + attHm(last) + ', before ' + attHm(halfExit));
    const earlyLeave = !s.flexibleExit && last != null && last < allowedExit && !(date === now.date && now.minutes < allowedExit);
    const parts = String(rec.raw).split(';').map((t) => t.trim()), bt = parts.map((t) => /^([01]?\d|2[0-3]):[0-5]\d$/.test(t) ? attMins(t) : null);
    const breakExcluded = ATT_BREAK_SKIP.has(name);
    const breakValid = !breakExcluded && !rec.duplicate && bt.length >= 2 && bt.length % 2 === 0 && bt.every((t, i) => t != null && (!i || t > bt[i - 1]));
    let breakMinutes = null; if (breakValid) { breakMinutes = 0; for (let i = 1; i < bt.length - 1; i += 2) breakMinutes += bt[i + 1] - bt[i]; }
    const breakLimit = attWeekday(date) === 3 ? 65 : 50, overBreak = updated && breakMinutes != null && breakMinutes > breakLimit;
    // Approved half day: not counted as a half day anywhere.
    const hd = attHalfDecision(date, name), halfExcused = reasons.length > 0 && !!hd && hd.status === 'approved';
    people.push({ name, status: 'present', due, outDue, grace, allowedExit, first, last, lateBy, late: lateBy > grace && !lateExcused, lateExcused, earlyLeave, breakMinutes, breakLimit, overBreak, breakExcluded,
      halfDay: reasons.length > 0 && !halfExcused, halfExcused, reasons, exitNote, raw: rec.raw, odd: times.length % 2 === 1 && times.length > 1 });
  }
  return { date, people, unknown: [...unknown], hasData: rows.some((r) => String(r.stamps).trim()) };
}
// Month so far (or up to one day), counting only days with punches from 20 Oct.
function attMonth(month, upTo) {
  const days = Object.keys(attData.dates).filter((d) => d.startsWith(month) && d >= ATT_START && (!upTo || d <= upTo)).sort().map(attClassifyDay).filter((d) => d.hasData);
  const per = new Map([...ATT_SCHEDULE.keys()].map((n) => [n, { name: n, days: 0, present: 0, leaves: 0, uninformed: 0, lates: 0, halfDays: 0, lateFine: 0, leaveFine: 0, overBreakDays: 0 }]));
  const lateNo = new Map();
  for (const day of days) for (const p of day.people) {
    if (p.status === 'not-started' || p.status === 'left') continue;
    const m = per.get(p.name); m.days++;
    if (p.status === 'leave') { m.leaves++; if (!attInformed(day.date, p.name)) { m.uninformed++; m.leaveFine += 200; } continue; }
    m.present++; if (p.overBreak) m.overBreakDays++; if (p.halfDay) m.halfDays++;
    if (p.late) { m.lates++; lateNo.set(day.date + '|' + p.name, m.lates); if (m.lates > 3) m.lateFine += 100; }
  }
  return { days, people: [...per.values()], lateNo };
}

const attTable = (head, rows, empty) => `<div class="scroll"><table><tr>${head.map((h) => `<th${h.startsWith('#') ? ' class="rs"' : ''}>${esc(h.replace(/^#/, ''))}</th>`).join('')}</tr>
  ${rows.length ? rows.join('') : `<tr><td colspan="${head.length}" class="empty">${esc(empty)}</td></tr>`}</table></div>`;
const attCard = (title, note, n, body) => `<section class="card"><h2>${esc(title)}${n != null ? ` <span class="count${n ? '' : ' att'}">${n}</span>` : ''}</h2>${note ? `<p class="sub">${note}</p>` : ''}${body}</section>`;

function attMonthCard(sum, month, upTo) {
  const now = attNow(), over = month < now.date.slice(0, 7);
  const rows = sum.people.filter((p) => p.days).sort((a, b) => (b.lateFine + b.leaveFine) - (a.lateFine + a.leaveFine) || b.lates - a.lates || a.name.localeCompare(b.name)).map((p) => {
    const bonus = p.lates === 0 && p.present > 0 ? 300 : 0, net = bonus - p.lateFine - p.leaveFine;
    return `<tr><td><b>${esc(attTitle(p.name))}</b></td><td class="rs">${p.present} / ${p.days}</td><td class="rs">${p.leaves}${p.uninformed ? ` <small>${p.uninformed} not approved</small>` : ''}</td>
      <td class="rs">${p.lates}${p.lates && p.lates <= 3 ? ` <small>${3 - p.lates} free left</small>` : ''}</td><td class="rs">${p.halfDays}</td><td class="rs">${p.overBreakDays}</td>
      <td class="rs">${p.lateFine ? rupees(p.lateFine) : '—'}</td><td class="rs">${p.leaveFine ? rupees(p.leaveFine) : '—'}</td>
      <td class="rs">${bonus ? rupees(300) + (over ? '' : ' <small>if no late till month end</small>') : '—'}</td>
      <td class="rs"><b class="${net < 0 ? 'neg' : net > 0 ? 'pos' : ''}">${net < 0 ? '−' + rupees(-net) : net > 0 ? '+' + rupees(net) : '₹0'}</b></td></tr>`;
  });
  const fines = sum.people.reduce((a, p) => a + p.lateFine + p.leaveFine, 0), bonuses = sum.people.filter((p) => p.lates === 0 && p.present > 0).length * 300;
  return attCard(attFmt(month + '-01', { month: 'long', year: 'numeric' }) + (upTo ? ' up to ' + attFmt(upTo, { day: 'numeric', month: 'short' }) : ''),
    `${sum.days.length} day${sum.days.length === 1 ? '' : 's'} with punches · fines <b>${rupees(fines)}</b> · bonuses <b>${rupees(bonuses)}</b>. First 3 lates free, then ₹100 each. No late all month = ₹300. Leave without informing = ₹200.`, null,
    attTable(['Employee', '#Present / days', '#Leave', '#Lates', '#Half days', '#Long breaks', '#Late fine', '#Leave fine', '#Bonus', '#Net'], rows, 'No punches for this month yet.'));
}

function attDaily(date) {
  const day = attClassifyDay(date), now = attNow();
  if (date < ATT_START || !day.hasData) {
    const latest = Object.keys(attData.dates).filter((d) => d >= ATT_START).sort().pop();
    return attCard('No punches for ' + attFmt(date), date < ATT_START ? 'Attendance rules start on 20 October 2026.' : date > now.date ? 'This day has not happened yet.' : 'Upload the PagarBook file that has this day (closed days have no punches).', null,
      latest ? `<button class="btn ghost" data-att-go="${latest}">Go to latest day (${attFmt(latest, { day: 'numeric', month: 'short' })})</button>` : '') + attMonthCard(attMonth(date.slice(0, 7)), date.slice(0, 7));
  }
  const sum = attMonth(date.slice(0, 7), date), wed = attWeekday(date) === 3, rev = attData.revisions[date];
  const present = day.people.filter((p) => p.status === 'present'), leave = day.people.filter((p) => p.status === 'leave');
  const late = present.filter((p) => p.late), half = present.filter((p) => p.halfDay), longBreak = present.filter((p) => p.overBreak);
  const lateFine = late.reduce((a, p) => a + ((sum.lateNo.get(date + '|' + p.name) || 0) > 3 ? 100 : 0), 0);
  const leaveFine = leave.filter((p) => !attInformed(date, p.name)).length * 200;
  const stat = (n, l) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`;
  const shown = day.people.filter((p) => p.status !== 'not-started' && p.status !== 'left');
  const pill = (t, c) => `<span class="pill ${c}">${esc(t)}</span>`;
  return `<div class="stats">${stat(present.length, 'Present')}${stat(leave.length, 'On leave')}${stat(late.length, 'Late')}${stat(half.length, 'Half day')}</div>
    <section class="card att-fines"><b>Fines for this day: ${rupees(lateFine + leaveFine)}</b><span class="sub" style="margin:0">Late ${rupees(lateFine)} (4th late onwards) · Leave without informing ${rupees(leaveFine)}</span></section>
    ${attCard('On leave', 'No punch on this day. Choose <b>Approve leave / informed</b> if they told you (no fine), or <b>Confirm uninformed</b> (₹200). Pending keeps ₹200 until you decide.', leave.length,
      attTable(['Employee', 'Approval', '#Fine'], leave.map((p) => { const a = attApproval(date, p.name), st = (a && a.status) || 'pending';
        return `<tr><td><b>${esc(attTitle(p.name))}</b></td><td><select data-att-approve="${esc(date + '|' + p.name)}" ${attBusy || rev === undefined ? 'disabled' : ''}>
          <option value="pending" ${st === 'pending' ? 'selected' : ''}>Pending review</option><option value="approved" ${st === 'approved' ? 'selected' : ''}>Approve leave / informed</option>
          <option value="uninformed" ${st === 'uninformed' ? 'selected' : ''}>Confirm uninformed</option></select>${a ? `<small>${esc(a.by || '')} · ${fmtFull(a.at)}</small>` : ''}</td>
          <td class="rs">${st === 'approved' ? '—' : rupees(200)}</td></tr>`; }), 'Nobody is on leave.'))}
    ${attCard('Late arrivals', 'First punch after the in-time plus grace' + (date >= ATT_POLICY ? ' (girls 10 min, others 5 min)' : '') + (wed ? '. Wednesday in-time: girls 9:15, others 9:00.' : '.')
      + ' Press <b>Approve late</b> if the late was allowed: it is then not counted anywhere (no late, no fine, no half day for being late). Press <b>Not approved</b> to confirm it counts.', late.length,
      attTable(['Employee', 'In-time', 'Allowed till', 'Came at', '#Late by', '#Late no. this month', '#Fine', 'Approval'], present.filter((p) => p.late || p.lateExcused).sort((a, b) => b.lateBy - a.lateBy).map((p) => {
        const n = sum.lateNo.get(date + '|' + p.name) || 0, ok = p.lateExcused;
        return `<tr><td><b>${esc(attTitle(p.name))}</b></td><td>${attHm(p.due)}</td><td>${attHm(p.due + p.grace)}</td><td>${attHm(p.first)}</td><td class="rs">${attSpan(p.lateBy)}</td>
          <td class="rs">${ok ? '—' : n + (n <= 3 ? ' <small>free</small>' : '')}</td><td class="rs">${!ok && n > 3 ? rupees(100) : '—'}</td>
          <td>${attDecisionCell('late', p.name, attLateDecision(date, p.name), ok)}</td></tr>`; }), 'Nobody was late.'))}
    ${attCard('Half days', 'More than 1 hour late, or last punch before 7:00 PM (6:50 PM for girls from 25 Oct). Irfan, Himanshu, Talha and Rocky have no fixed exit.'
      + ' Press <b>Approve half day</b> if it was allowed: it is then not counted as a half day anywhere. Press <b>Not approved</b> to confirm it counts.', half.length,
      attTable(['Employee', 'In', 'Out', 'Reason', 'Approval'], present.filter((p) => p.halfDay || p.halfExcused).map((p) => `<tr><td><b>${esc(attTitle(p.name))}</b></td><td>${attHm(p.first)}</td><td>${attHm(p.last)}</td>
        <td style="white-space:normal">${esc(p.reasons.join(' · '))}</td><td>${attDecisionCell('half', p.name, attHalfDecision(date, p.name), p.halfExcused)}</td></tr>`), 'No half days.'))}
    ${attCard('Long breaks', `Total of the break punches (out and back in) over ${wed ? 65 : 50} minutes. Only flagged, no fine.`, longBreak.length,
      attTable(['Employee', 'Total breaks', 'Limit', 'Over by'], longBreak.sort((a, b) => b.breakMinutes - a.breakMinutes).map((p) => `<tr><td><b>${esc(attTitle(p.name))}</b></td><td>${attSpan(p.breakMinutes)}</td><td>${p.breakLimit} min</td><td>${attSpan(p.breakMinutes - p.breakLimit)}</td></tr>`), date >= ATT_POLICY ? 'No long breaks.' : 'Break limits start on 25 October.'))}
    ${attCard('Everyone on ' + attFmt(date, { weekday: 'short', day: 'numeric', month: 'short' }), 'In = first punch, Out = last punch.', shown.length,
      attTable(['Employee', 'Shift', 'In', 'Out', 'Allowed exit', 'Breaks', 'Status', 'All punches'], shown.map((p) => {
        const st = p.status === 'leave' ? pill('On leave', 'purple') : [p.late ? pill('Late ' + attSpan(p.lateBy) + (attLateDecision(date, p.name) ? ' · not approved' : ''), 'amber') : p.lateExcused ? pill('Late approved', 'green') : pill('On time', 'green'), p.halfDay ? pill('Half day', 'red') : p.halfExcused ? pill('Half day approved', 'green') : '', p.exitNote ? pill(p.exitNote, 'gray') : '', p.earlyLeave ? pill('Early exit', 'red') : '', p.overBreak ? pill('Long break', 'amber') : ''].join(' ');
        return `<tr><td><b>${esc(attTitle(p.name))}</b></td><td>${attHm(p.due)} – ${p.outDue != null ? attHm(p.outDue) : 'Till close'}</td><td>${p.status === 'leave' ? '—' : attHm(p.first)}</td><td>${p.status === 'leave' ? '—' : attHm(p.last)}</td>
          <td>${p.allowedExit != null ? attHm(p.allowedExit) : 'Flexible'}</td><td>${p.status === 'leave' ? '—' : p.breakExcluded ? 'Not checked' : p.breakMinutes == null ? 'Check punches' : attSpan(p.breakMinutes)}</td><td>${st}</td>
          <td class="raw">${esc(p.raw || '—')}${p.odd ? ' <small>odd number of punches</small>' : ''}</td></tr>`; }), '—')
      + (day.people.some((p) => p.status === 'not-started') ? `<p class="sub" style="margin:8px 0 0">Not counted yet: ${esc(day.people.filter((p) => p.status === 'not-started').map((p) => attTitle(p.name) + ' (from ' + attFmt(ATT_SCHEDULE.get(p.name).start, { day: 'numeric', month: 'short' }) + ')').join(', '))}.</p>` : '')
      + (day.unknown.length ? `<p class="sub" style="margin:8px 0 0">In PagarBook but not on the timing list (not counted): ${esc(day.unknown.map(attTitle).join(', '))}.</p>` : ''))}`
    + attMonthCard(sum, date.slice(0, 7), date);
}

// PagarBook files: the monthly Punch Report (Staff Name, then one column per date like 25-10-2026) or a daily file (Staff Name in B1, date in C1).
function attCellDate(v) {
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  if (typeof v === 'number' && v > 30000 && v < 80000) return new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 864e5).toISOString().slice(0, 10);
  const m = typeof v === 'string' && v.trim().match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
  return m ? m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') : null;
}
const attCellStamps = (v) => typeof v === 'number' && v >= 0 && v < 1 ? (() => { const t = Math.round(v * 1440); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); })() : String(v ?? '').trim();
function readPunchBook(wb, fileName, today) {
  const days = [], skipped = [], outside = [];
  for (const sn of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' });
    const head = rows[0] || [], nc = head.findIndex((h) => attNorm(h).replace(/ /g, '') === 'STAFFNAME');
    if (nc < 0) { skipped.push(sn + ' (no Staff Name heading)'); continue; }
    let dated = 0;
    for (let c = nc + 1; c < head.length; c++) {
      const d = attCellDate(head[c]); if (!d) continue; dated++;
      const list = rows.slice(1).filter((r) => typeof r[nc] === 'string' && r[nc].trim()).map((r) => ({ name: r[nc].trim(), stamps: attCellStamps(r[c]) }));
      if (!list.some((r) => attHasPunch(r.stamps))) continue; // shop closed / no punches that day
      if (d < ATT_START || d > today) { outside.push(d); continue; }
      if (days.some((x) => x.date === d)) throw new Error('Two sheets have ' + d + '. Choose one file per date.');
      days.push({ date: d, rows: list, source: fileName });
    }
    if (!dated) skipped.push(sn + ' (no dates in the heading row)');
  }
  return { days, skipped, outside };
}

function attPrint(date, monthly) {
  const sum = attMonth(date.slice(0, 7), monthly ? undefined : date), days = monthly ? sum.days : sum.days.filter((d) => d.date === date), per = new Map();
  if (!days.length) return toast('No punches for this period to print', true);
  for (const day of days) for (const p of day.people) {
    if (p.status === 'not-started' || p.status === 'left') continue;
    if (!per.has(p.name)) per.set(p.name, { name: p.name, lates: 0, halfDays: 0, leaves: 0, approved: 0, uninformed: 0, pending: 0, lateFine: 0, leaveFine: 0, dates: [] });
    const r = per.get(p.name), notes = [];
    if (p.late) { r.lates++; r.lateFine += (sum.lateNo.get(day.date + '|' + p.name) || 0) > 3 ? 100 : 0; notes.push('Late'); }
    if (p.halfDay) { r.halfDays++; notes.push('Half day'); }
    if (p.status === 'leave') { r.leaves++; const a = attApproval(day.date, p.name), st = a && a.status === 'approved' ? 'approved' : a && a.status === 'uninformed' ? 'uninformed' : 'pending'; r[st]++; if (st !== 'approved') r.leaveFine += 200; notes.push(st === 'approved' ? 'Informed leave' : st === 'uninformed' ? 'Uninformed leave' : 'Leave (pending)'); }
    if (notes.length) r.dates.push(day.date.slice(8) + ': ' + notes.join(', '));
  }
  const list = [...per.values()].filter((r) => r.lates || r.halfDays || r.leaves).sort((a, b) => (b.lateFine + b.leaveFine) - (a.lateFine + a.leaveFine) || a.name.localeCompare(b.name));
  const lt = list.reduce((n, r) => n + r.lateFine, 0), lv = list.reduce((n, r) => n + r.leaveFine, 0);
  const period = monthly ? attFmt(date.slice(0, 7) + '-01', { month: 'long', year: 'numeric' }) : attFmt(date);
  const t = (head, rows) => `<table><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr>${rows.join('') || `<tr><td colspan="${head.length}">No late arrivals, half days or leave.</td></tr>`}</table>`;
  const old = document.getElementById('attPrint'); if (old) old.remove();
  const f = document.createElement('iframe'); f.id = 'attPrint'; f.style.cssText = 'position:fixed;left:-10000px;top:0;width:1100px;height:800px;border:0'; document.body.appendChild(f);
  f.onload = () => { const w = f.contentWindow; w.addEventListener('afterprint', () => f.remove(), { once: true }); w.focus(); w.print(); };
  f.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><title>Vrinda Attendance ${esc(period)}</title><style>@page{size:A4 landscape;margin:12mm}body{font:11px Arial,sans-serif;color:#111}h1{font-size:20px;margin:0 0 4px}h2{font-size:14px}table{width:100%;border-collapse:collapse;margin:12px 0}th,td{border:1px solid #aaa;padding:6px;text-align:left}tr{break-inside:avoid}</style></head><body>
    <h1>Vrinda Medical Agencies</h1><h2>Attendance &amp; penalties · ${esc(period)}</h2><p>${days.length} day(s) with punches · Printed ${esc(new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }))}<br>Late penalties ${rupees(lt)} · Leave penalties ${rupees(lv)} · Total <b>${rupees(lt + lv)}</b></p>
    ${t(['Employee', 'Late days', 'Half days', 'Leave days', 'Informed leave', 'Confirmed uninformed', 'Pending review', 'Late penalty', 'Leave penalty', 'Total penalty'], list.map((r) => `<tr><td>${esc(attTitle(r.name))}</td><td>${r.lates}</td><td>${r.halfDays}</td><td>${r.leaves}</td><td>${r.approved}</td><td>${r.uninformed}</td><td>${r.pending}</td><td>${rupees(r.lateFine)}</td><td>${rupees(r.leaveFine)}</td><td>${rupees(r.lateFine + r.leaveFine)}</td></tr>`))}
    <p>First 3 lates in a month are free; each late after that is ₹100. Informed leave has no fine. Uninformed and pending leave are ₹200 per day. Half days are counted, with no separate money fine.</p>
    ${monthly ? '<h2>Dates</h2>' + t(['Employee', 'Days'], list.map((r) => `<tr><td>${esc(attTitle(r.name))}</td><td>${r.dates.map(esc).join('<br>')}</td></tr>`)) : ''}</body></html>`;
}

// ---------- Shop Open/Close (owners and MANSI) ----------
// Each day two people open the shop and two close it. Rule (owner): each person on SHOP_LIST must appear at least 5 times
// a month (openings + closings together); anyone below 5 has a ₹500 penalty for that month (at current counts until month end).
// Owners see and correct any day from 1 Oct 2026; MANSI enters today only. Days 1-11 Oct came from the old Excel sheet.
// Managers (Arun, Vicky), the girls and the supply team are not part of it (owner, 2026-10-31).
const SHOP_LIST = ['FARHAN', 'HAYYUL', 'MUKUL', 'SONU', 'AFZAL', 'RIZWAN', 'YASH', 'ANAS', 'AZEEM', 'ABHAY', 'FARAZ', 'HAMZA', 'JUNAID', 'REHAN', 'SAFFAN', 'SAIF', 'SUFIYAN', 'ZUHAIB', 'ADNAN', 'NAVED', 'RAJ', 'RAYYAN'];
const SHOP_MIN = 5, SHOP_FINE = 500;
function shopCounts(rows) {
  const per = new Map(SHOP_LIST.map((n) => [n, { name: n, opened: 0, closed: 0, listed: true }]));
  for (const r of rows) for (const [ph, key] of [['opening', 'opened'], ['closing', 'closed']]) for (const n of ((r.data[ph] || {}).names || [])) {
    const k = attNorm(n); if (!k) continue;
    if (!per.has(k)) per.set(k, { name: k, opened: 0, closed: 0, listed: false });
    per.get(k)[key]++;
  }
  return [...per.values()].map((p) => { const total = p.opened + p.closed; return { ...p, total, needed: p.listed ? Math.max(0, SHOP_MIN - total) : null, fine: p.listed ? (total < SHOP_MIN ? SHOP_FINE : 0) : null }; })
    .sort((a, b) => (b.listed - a.listed) || a.total - b.total || a.name.localeCompare(b.name));
}
function shopSummaryHtml(rows, month, monthOver) {

      return `<div class="bill"><div class="info" style="color:var(--text)"><b>${ph === 'opening' ? 'Opened' : 'Closed'} · ${esc(attFmt(date, { weekday: 'short', day: 'numeric', month: 'short' }))}</b><br>
        ${list.map((p) => `${esc(attTitle(p.name))} <span class="sub">${fmtTime(p.at)}</span> <button class="btn ghost small del" data-push-remove="${esc(p.name)}" data-date="${date}" data-phase="${ph}">Remove</button>`).join(' &nbsp; ')}</div>
        <button class="btn green" data-push-verify="${ph}" data-date="${date}">✓ Verify</button></div>`; }).join('')}</section>`;
}
async function viewShop(m) {
  const owner = state.me.is_admin;
  if (!owner && state.me.username !== 'mansi') return viewShopPush(m);
  let saveDate;
  if (!owner) {
    const d = await api('GET', '/api/shop-open');
    saveDate = d.today;
    m.innerHTML = shopWaitingHtml(d.waiting) + shopEntryHtml(d.today, d.rows[0], d.names, true) + `<p class="sub">You can verify and enter today's opening and closing. Ask the owner to correct an earlier day.</p>`;
  } else {
    if (!filters.shopDate) filters.shopDate = attNow().date;
    const date = saveDate = filters.shopDate, month = date.slice(0, 7), monthly = filters.shopMode === 'monthly';
    const d = await api('GET', '/api/shop-open?month=' + month), today = d.today;
    const monthOver = month < today.slice(0, 7), row = d.rows.find((r) => r.date === date);
    m.innerHTML = `<section class="card"><div class="att-bar">
        <div class="seg"><button data-shop-mode="daily" class="${monthly ? '' : 'on'}">Daily</button><button data-shop-mode="monthly" class="${monthly ? 'on' : ''}">Monthly</button></div>
        ${monthly ? `<button class="btn ghost small" data-shop-step="-1">◀</button><input type="month" id="shopmonth" min="${d.start.slice(0, 7)}" max="${today.slice(0, 7)}" value="${month}"><button class="btn ghost small" data-shop-step="1">▶</button>`
          : `<button class="btn ghost small" data-shop-step="-1">◀</button><input type="date" id="shopdate" min="${d.start}" max="${today}" value="${date}"><button class="btn ghost small" data-shop-step="1">▶</button><button class="btn ghost small" id="shoptoday">Today</button>`}
        <span class="grow"></span><button class="btn ghost small" id="shoprefresh">↻ Refresh</button><button class="btn ghost small" id="shopprint">🖨 Print report</button></div></section>
      ${shopWaitingHtml(d.waiting)}
      ${monthly ? '' : shopEntryHtml(date, row, d.names, false)}
      ${shopSummaryHtml(d.rows, month, monthOver)}
      ${monthly ? `<section class="card"><h2>Day by day</h2><p class="sub">Tap a day to see or correct it.</p>${attTable(['Date', 'Opened by', 'Closed by', 'Saved by'], d.rows.slice().reverse().map((r) => {
        const o = r.data.opening, c = r.data.closing, by = [o && o.by, c && c.by].filter((x, i, a) => x && a.indexOf(x) === i).join(', ');
        return `<tr class="click" data-shop-day="${r.date}"><td><b>${esc(attFmt(r.date, { weekday: 'short', day: 'numeric', month: 'short' }))}</b></td><td>${o ? esc(o.names.map(attTitle).join(', ')) : '<span class="sub">—</span>'}</td>
          <td>${c ? esc(c.names.map(attTitle).join(', ')) : '<span class="sub">—</span>'}</td><td><small>${esc(by)}</small></td></tr>`; }), 'No days saved in this month.')}</section>` : ''}`;
    const go = (x) => { filters.shopDate = x; loadTab(); };
    m.querySelectorAll('[data-shop-mode]').forEach((b) => b.onclick = () => { filters.shopMode = b.dataset.shopMode; loadTab(); });
    m.querySelectorAll('[data-shop-step]').forEach((b) => b.onclick = () => {
      const n = +b.dataset.shopStep;
      if (monthly) { const [y, mo] = month.split('-').map(Number), x = new Date(Date.UTC(y, mo - 1 + n, 1)).toISOString().slice(0, 7); if (x >= d.start.slice(0, 7) && x <= today.slice(0, 7)) go(x === today.slice(0, 7) ? today : x + '-01'); }
      else { const x = attShiftDay(date, n); if (x >= d.start && x <= today) go(x); }
    });
    m.querySelectorAll('[data-shop-day]').forEach((tr) => tr.onclick = () => { filters.shopMode = 'daily'; go(tr.dataset.shopDay); });
    if ($('#shopdate')) $('#shopdate').onchange = (e) => e.target.value && go(e.target.value);
    if ($('#shopmonth')) $('#shopmonth').onchange = (e) => e.target.value && go(e.target.value === today.slice(0, 7) ? today : e.target.value + '-01');
    if ($('#shoptoday')) $('#shoptoday').onclick = () => go(today);
    $('#shoprefresh').onclick = () => loadTab().then(() => toast('Refreshed'));
    $('#shopprint').onclick = () => shopPrint(d.rows, month, monthOver);
  }
  m.querySelectorAll('[data-push-verify]').forEach((b) => b.onclick = () => act(b, () => api('POST', '/api/shop-punch/verify', { date: b.dataset.date, phase: b.dataset.pushVerify }), 'Verified and saved'));
  m.querySelectorAll('[data-push-remove]').forEach((b) => b.onclick = () => { if (confirm('Remove ' + attTitle(b.dataset.pushRemove) + '?')) act(b, () => api('POST', '/api/shop-punch/remove', { date: b.dataset.date, phase: b.dataset.phase, name: b.dataset.pushRemove }), 'Removed'); });
  m.querySelectorAll('form[data-shop-phase]').forEach((f) => f.onsubmit = (e) => {
    e.preventDefault();
    act(f.querySelector('button'), () => api('POST', '/api/shop-open', { date: saveDate, phase: f.dataset.shopPhase, names: [f.n1.value, f.n2.value], revision: +f.dataset.rev }),
      f.dataset.shopPhase === 'opening' ? 'Opening saved' : 'Closing saved');
  });
}

async function boot() {
  try { const r = await api('GET', '/api/me'); state.me = r.user; state.tasks = r.tasks; state.tab = r.user.is_admin || r.user.is_manager ? 'all' : !r.user.can_proxy && r.user.can_prep ? 'quick' : 'other'; }
  catch { state.me = null; }
  render();
}
boot();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
