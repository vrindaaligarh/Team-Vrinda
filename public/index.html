<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vrinda Medical Agencies</title>
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vrinda Medical">
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6ea;
    --primary: #1f6feb; --primary-text: #fff; --green: #1a7f37; --green-bg: #e6f4ea;
    --amber: #9a6700; --amber-bg: #fff4d6; --red: #c62828; --red-bg: #fde8e8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1b1f25; --text: #e6e8eb; --muted: #9aa3ad; --line: #2c323a;
      --primary: #4c8dff; --green: #5bd17a; --green-bg: #173322; --amber: #f0c050; --amber-bg: #3a2e10;
      --red: #ff7b72; --red-bg: #3d1a1a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  .sections { display: flex; gap: 8px; padding: 12px 16px 0; max-width: 1200px; margin: 0 auto; overflow-x: auto; }
  .sections button { border: 2px solid var(--line); background: var(--card); color: var(--muted); padding: 8px 16px; border-radius: 99px; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .sections button.on { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
  nav { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 16px 0; max-width: 1200px; margin: 0 auto; }
  nav button { background: none; border: 0; padding: 8px 12px; border-radius: 8px; color: var(--muted); font-weight: 600; cursor: pointer; font-size: 14px; }
  nav button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  main { max-width: 1200px; margin: 0 auto; padding: 12px 16px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 4px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .code { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 8px; background: var(--primary); color: var(--primary-text); font-weight: 700; font-size: 14px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  button.btn, label.btn { display: inline-block; border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 700; font-size: 15px; cursor: pointer; background: var(--primary); color: var(--primary-text); }
  button.btn.green { background: var(--green); color: #fff; }
  button.btn.amber { background: #d29922; color: #1d1600; }
  button.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 600; }
  button.btn.small { padding: 5px 10px; font-size: 13px; }
  button.btn:disabled { opacity: .5; cursor: wait; }
  input, select { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--text); min-width: 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .bill { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .bill:first-of-type { border-top: 0; }
  .bill .no { font-size: 18px; font-weight: 700; min-width: 90px; }
  .bill .info { flex: 1; color: var(--muted); font-size: 13px; min-width: 160px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .pill.green { background: var(--green-bg); color: var(--green); }
  .pill.amber { background: var(--amber-bg); color: var(--amber); }
  .pill.gray { background: var(--bg); color: var(--muted); }
  .pill.red { background: var(--red-bg); color: var(--red); }
  .empty { color: var(--muted); padding: 8px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td small { color: var(--muted); display: block; }
  .scroll { overflow-x: auto; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 12px; }
  .items-in { width: 84px; }
  .no small.items { display: block; font-size: 12px; font-weight: 600; color: var(--muted, #667); }
  .task-tile small.who { display: block; font-size: 11px; font-weight: 500; color: var(--muted); line-height: 1.3; margin-top: 2px; }
  .bill-tile.on small.who { color: inherit; opacity: .85; }
  .late { color: var(--red); }
  select.points { width: auto; min-width: 92px; font-weight: 600; }
  .withside { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 12px; align-items: start; }
  .idlelist { position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow-y: auto; }
  .idle-name small.who { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
  .idle-name { padding: 6px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
  @media (max-width: 800px) {
    .withside { grid-template-columns: 1fr; }
    .idlelist { position: static; max-height: none; order: -1; }
    .idlelist .idle-name { display: inline-block; border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; margin: 0 4px 4px 0; font-size: 13px; }
  }

  /* Quick Preparing Entry (FARAZ, phone first) */
  .qk h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .qk-names { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .qk-name { border: 2px solid var(--line); background: var(--card); color: var(--text); border-radius: 14px; padding: 12px 6px; font: 700 15px system-ui; cursor: pointer; position: relative; }
  .qk-name small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .qk-name.free small { color: var(--green); }
  .qk-name.on { border-color: var(--primary); background: var(--primary); color: var(--primary-text); box-shadow: 0 4px 14px rgba(31,111,235,.35); }
  .qk-name.on small { color: inherit; opacity: .85; }
  .qk-form { display: grid; gap: 12px; }
  .qk-who { font-size: 22px; font-weight: 800; }
  .qk-field label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .qk-field input { width: 100%; box-sizing: border-box; font: 800 34px/1.1 ui-monospace, monospace; letter-spacing: .12em; text-align: center; padding: 14px 8px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); color: var(--text); }
  .qk-field input::placeholder { color: var(--muted); opacity: .35; }
  .qk-field input:focus { outline: none; border-color: var(--primary); background: var(--card); }
  .qk-prev { text-align: center; font: 700 15px system-ui; color: var(--primary); min-height: 20px; margin-top: 4px; }
  .qk-go { font: 800 20px system-ui; padding: 18px; border-radius: 16px; border: 0; background: var(--green); color: #fff; cursor: pointer; }
  .qk-go:disabled { opacity: .45; }
  .qk-done { text-align: center; font: 700 16px system-ui; color: var(--green); background: var(--green-bg); border-radius: 12px; padding: 10px; }
  .qk-group { border-top: 1px solid var(--line); padding: 10px 0; }
  .qk-group h3 { margin: 0 0 6px; font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
  .qk-group h3 small { font-weight: 500; color: var(--muted); font-size: 13px; }
  .qk-bill { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .qk-bill b { font: 700 17px ui-monospace, monospace; }
  .qk-bill .grow { flex: 1; font-size: 13px; color: var(--muted); }
  .qk-bill .btn { padding: 10px 18px; font-size: 15px; }

  /* Debtors */
  .rs { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .up { color: var(--red); } .down { color: var(--green); }
  .dbar { height: 6px; border-radius: 3px; background: var(--primary); opacity: .7; min-width: 2px; }
  tr.pick { background: var(--amber-bg); }
  tr[data-day] { cursor: pointer; }
  .enterbtn { font-size: 18px; padding: 12px 20px; min-width: 110px; }
  .rk { display: flex; flex-wrap: wrap; gap: 6px; }
  .rk button { border: 1.5px solid var(--primary); background: var(--card); color: var(--text); border-radius: 99px; padding: 6px 12px; font: 700 16px ui-monospace, monospace; cursor: pointer; }
  .rk button span { color: var(--muted); font-size: 12px; margin-left: 2px; }
  @keyframes margflash { 0%, 100% { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-bg); } 50% { border-color: var(--amber); box-shadow: 0 0 0 6px var(--amber-bg); } }
  .margflash { border: 2px solid var(--red); animation: margflash 1.2s ease-in-out infinite; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; display: none; z-index: 10; max-width: 90vw; }
  #updating { position: fixed; left: 0; right: 0; top: 0; background: #9a6700; color: #fff; padding: 12px 16px; text-align: center; font-weight: 600; z-index: 20; }
  #toast.err { background: var(--red); color: #fff; }
  .login { max-width: 360px; margin: 10vh auto; }
  .login input { width: 100%; margin-bottom: 10px; }
  .login button { width: 100%; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px; }
  .checks label { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 13px; cursor: pointer; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--bg); }
  .detail td { background: var(--bg); white-space: normal; }
  input, select { font-size: 16px; } /* stops phones zooming in on tap */
  header { padding-top: max(10px, env(safe-area-inset-top)); }
  @media (max-width: 520px) {
    header .sub { order: 3; width: 100%; margin: 0; }
    header button.btn.small { padding: 5px 8px; }
    main { padding: 10px 12px 40px; } nav { padding: 8px 12px 0; }
    .card { padding: 14px; }
    .bill button.btn { flex: 1 1 100%; padding: 12px; font-size: 16px; }
  }
  .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .task-tile { display: flex; align-items: center; gap: 8px; text-align: left; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; min-height: 52px; }
  .task-tile.on { border-color: var(--green); background: var(--green-bg); }
  .card.now { border-color: #d29922; }
  .bill-tile { border-color: var(--primary); }
  .bill-tile.on { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }
  .bill-tile.on .code { background: var(--primary-text); color: var(--primary); }
  .count { background: var(--red); color: #fff; border-radius: 99px; min-width: 24px; height: 24px; display: inline-grid; place-items: center; font-size: 13px; padding: 0 6px; }
  .billsearch { width: 100%; margin-bottom: 4px; }
  .bill[hidden], .chip[hidden] { display: none; }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .chip { display: flex; flex-direction: column; align-items: flex-start; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--primary); background: var(--card); color: var(--text); font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; }
  .chip small { font-size: 11px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .chip:disabled { opacity: .45; cursor: default; }
  .chip.tools { cursor: default; }
  .chip.tools .row { margin-top: 6px; gap: 4px; }
  .chip.tools .btn { padding: 4px 8px; font-size: 12px; }
  .chip.off { border: 1px dashed var(--line); color: var(--muted); font-weight: 600; cursor: default; }
  .stage-panel { border: 2px solid var(--primary); }
  button.btn.del { color: var(--red); border-color: var(--red); }
  .card.fix { border-color: var(--red); background: var(--red-bg); }

  /* Attendance */
  .pill.purple { background: #ece8f6; color: #4a3a86; }
  @media (prefers-color-scheme: dark) { .pill.purple { background: #2c2545; color: #c4b8f0; } }
  .att-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .att-bar input[type=date], .att-bar input[type=month] { width: auto; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: var(--card); color: var(--muted); padding: 9px 14px; font-weight: 700; cursor: pointer; font-size: 14px; }
  .seg button.on { background: var(--primary); color: var(--primary-text); }
  .att-fines { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
  .att-fines b { font-size: 17px; }
  td.raw { white-space: normal; min-width: 180px; font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .neg { color: var(--red); } .pos { color: var(--green); }
  .card h2 .count.att { background: var(--muted); }
  details.rules summary { cursor: pointer; font-weight: 600; color: var(--primary); }
  details.rules li { margin: 4px 0; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString([], { day: '2-digit', month: 'short' }) : '';
const fmtFull = (iso) => iso ? fmtDate(iso) + ' ' + fmtTime(iso) : '';
function dur(a, b) {
  if (a == null || b == null || a === '' || b === '') return '';
  const m = Math.round((new Date(b) - new Date(a)) / 60000);
  return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
}
const ago = (iso) => dur(iso, new Date().toISOString()) || '0m';

let state = { me: null, tasks: [], tab: 'other', section: 'bills' };
let refreshTimer = null;

function updating(on) {
  let d = $('#updating');
  if (!on) { if (d) d.remove(); return; }
  if (!d) { d = document.createElement('div'); d.id = 'updating'; d.textContent = 'The app is updating. Please wait a minute, it will continue by itself…'; document.body.appendChild(d); }
}
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), 2500);
}
// While the server restarts for an update (502/503/504 or no connection), show a notice and keep retrying for up to 3 minutes.
async function api(method, url, body) {
  let r;
  for (let i = 0; ; i++) {
    try { r = await fetch(url, { method, headers: { 'Content-Type': 'application/json', ...(state.tab === 'proxy' && state.forUser ? { 'X-For-User': String(state.forUser) } : {}) }, body: body ? JSON.stringify(body) : undefined }); }
    catch { r = null; }
    if (r && ![502, 503, 504].includes(r.status)) break;
    if (i >= 36) { updating(false); throw new Error('Cannot reach the server. Check the internet and try again.'); }
    updating(true); await new Promise((ok) => setTimeout(ok, 5000));
  }
  updating(false);
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && url !== '/api/login') { state.me = null; render(); throw new Error('Please log in'); }
  if (!r.ok) throw new Error(data.error || 'Error');
  return data;
}
async function act(btn, fn, okMsg) {
  if (btn) btn.disabled = true;
  try { await fn(); if (okMsg) toast(okMsg); await loadTab(); }
  catch (e) { toast(e.message, true); }
  finally { if (btn) btn.disabled = false; }
}

// ---------- login ----------
function renderLogin() {
  $('#app').innerHTML = `
    <div class="card login">
      <h2>Vrinda Medical Agencies</h2><p class="sub">Log in with your ID</p>
      <form id="lf"><input name="u" placeholder="Username" autocapitalize="off" autocomplete="username" value="${esc(new URLSearchParams(location.search).get('u') || '')}">
      <input name="p" type="password" placeholder="Password" autocomplete="current-password"><button class="btn">Log in</button></form>
    </div>`;
  { const f = $('#lf'); (f.u.value ? f.p : f.u).focus(); }
  $('#lf').onsubmit = async (e) => {
    e.preventDefault();
    try { await api('POST', '/api/login', { username: e.target.u.value, password: e.target.p.value }); await boot(); }
    catch (err) { toast(err.message, true); }
  };
}

// ---------- shell ----------
// Top-level sections of the Vrinda Medical Agencies dashboard; Bill Tracker holds every tab below. More sections come later.
const SECTIONS_ALL = [['bills', 'Bill Tracker'], ['debtors', 'Debtors', (me) => me.is_admin], ['orders', 'Orders', (me) => me.is_admin], ['attendance', 'Attendance', (me) => me.is_admin || me.username === 'mansi'], ['shop', 'Shop Open/Close', (me) => me.is_admin || me.username === 'mansi' || me.can_shop]];
const sections = () => SECTIONS_ALL.filter(([, , ok]) => !ok || ok(state.me));
function tabs() {
  if (state.section === 'debtors') return [['debtors', 'Debtors']];
  if (state.section === 'orders') return [['orders', 'Plan & Dues'], ['orderlist', 'All Orders'], ['ordercos', 'Companies']];
  if (state.section === 'attendance') return [['attendance', 'Attendance']];
  if (state.section === 'shop') return [['shop', 'Shop Open/Close']];
  // Owners don't log their own jobs, so they don't get My Jobs.
  const t = state.me.is_admin ? [['other', 'Work']] : [['other', 'Work'], ['mine', 'My Jobs']];
  if (state.me.can_proxy) t.splice(1, 0, ['prep', 'Preparing Entry'], ['proxy', 'Enter for Staff']);
  else if (state.me.can_prep) t.unshift(['quick', 'Preparing Entry']);
  if (state.me.is_manager) t.splice(1, 0, ['board', 'Live Board']);
  if (state.me.verify_codes.length && !state.me.is_admin && !state.me.is_manager) t.push(['verify', 'Verify Jobs']);
  if (state.me.is_admin || state.me.tasks.includes('FR')) t.push(['final', 'Final Verification']);
  if (state.me.can_proxy && !state.me.is_admin && !state.me.is_manager) t.push(['all', 'All Bills']);
  if (state.me.can_verify_items && !state.me.is_admin && !state.me.is_manager) t.push(['items', 'Verify Racks']);
  if (state.me.is_admin || state.me.is_manager) t.push(['all', 'All Bills'], ['otherlog', 'Task Log'], ['status', 'Staff Status'], ['report', 'Daily Report'], ['items', 'Verify Racks'], ['incentive', 'Incentive'], ['fixes', 'Fix Requests']);
  if (state.me.is_admin) t.push(['staff', 'Staff'], ['codes', 'Task Codes']);
  return t;
}
function render() {
  clearInterval(refreshTimer); clearInterval(margTimer);
  if (!state.me) return renderLogin();
  const myCodes = state.me.is_admin ? 'Owner' : [state.me.is_manager ? 'Manager' : '', ...state.me.tasks].filter(Boolean).join(', ');
  $('#app').innerHTML = `
    <header><h1>Vrinda Medical Agencies</h1>
      <span class="sub" style="margin:0">${esc(state.me.name)}${myCodes ? " · " + esc(myCodes) : ""}</span>
      <button class="btn ghost small" id="pw">Password</button>
      <button class="btn ghost small" id="lo">Log out</button></header>
    <div class="sections">${sections().map(([k, l]) => `<button data-section="${k}" class="${state.section === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <nav>${tabs().map(([k, l]) => `<button data-tab="${k}" class="${state.tab === k ? 'on' : ''}">${l}</button>`).join('')}</nav>
    <main><div id="margbar"></div><div id="fixbar"></div><div id="main"></div></main>`;
  $('nav').onclick = (e) => { const k = e.target.dataset.tab; if (k) { state.tab = k; render(); } };
  $('.sections').onclick = (e) => {
    const k = e.target.dataset.section; if (!k || k === state.section) return;
    if (state.section === 'bills') state.billTab = state.tab;
    state.section = k; state.tab = k === 'bills' ? state.billTab || tabs()[0][0] : tabs()[0][0]; render();
  };
  $('#lo').onclick = async () => { await api('POST', '/api/logout'); state.me = null; render(); };
  $('#pw').onclick = changePassword;
  loadTab();
  if (state.me.dept === 'Computer' || state.me.is_admin) { margBar(); margTimer = setInterval(margBar, 20000); }
  if (['all', 'other', 'status', 'final', 'proxy', 'prep', 'quick', 'board', 'attendance'].includes(state.tab)) refreshTimer = setInterval(() => { if (!document.querySelector('input:focus, select:focus') && !attBusy) loadTab(); }, 15000);
}
async function changePassword() {
  const oldPassword = prompt('Current password'); if (oldPassword == null) return;
  const newPassword = prompt('New password (at least 4 characters)'); if (!newPassword) return;
  try { await api('POST', '/api/password', { oldPassword, newPassword }); toast('Password changed'); } catch (e) { toast(e.message, true); }
}
async function loadTab() {
  const m = $('#main'); if (!m) return;
  try {

// Staff may skip leading zeros: CA7536 -> CA007536, T50810 -> T050810.
const padBillNo = (no) => no.replace(/^\d{1,5}$/, (d) => (Number(d) < 1 ? d : Number(d) < 15000 ? 'CA' + d.padStart(6, '0') : d.length === 5 ? (Number(d) < 50000 ? 'R0' : 'T0') + d : d)).replace(/^([A-Z]{1,2})(\d{1,6})$/, (m, p, d) => p + d.padStart(6, '0'));

function askQty(label) {

    if (v === null || !v.trim()) return undefined;

    if (us) { e.preventDefault(); return act(null, () => api('POST', '/api/syrup', { entry_id: running.id, remove: +us.dataset.unsyrup }), 'Removed'); }
    const d = e.target.closest('button[data-id]');
    if (d) {
      // Syrup cases: the number of cases added is the count, no question.
      const listed = running && ((running.cases || []).length + (running.racks || []).length);
      const qty = listed ? listed : running && running.count_label ? askQty(running.count_label) : undefined;
      return act(d, () => api('POST', '/api/work', { action: 'end', id: +d.dataset.id, qty }), 'Ended');
    }
  };
}

function downloadCsv(stages, bills) {
  const head = ['Bill No', 'Items', 'Created'];
  stages.forEach((s) => s.kind === 'single' ? head.push(`${s.code} Time`, `${s.code} By`) : head.push(`${s.code} Start`, `${s.code} End`, `${s.code} Minutes`, `${s.code} By`));
  const lines = [head];
  for (const b of bills) {
    const row = [b.bill_no, b.items ?? '', fmtFull(b.created_at)];
    for (const s of stages) {
      const e = b.stages[s.code] || {};
      if (s.kind === 'single') row.push(fmtFull(e.end_at), e.end_by_name || '');
      else row.push(fmtFull(e.start_at), fmtFull(e.end_at), e.start_at && e.end_at ? Math.round((new Date(e.end_at) - new Date(e.start_at)) / 60000) : '', [e.start_by_name, e.end_by_name].filter((v, i, a) => v && a.indexOf(v) === i).join(' / '));
    }
    lines.push(row);
  }
  const csv = lines.map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `bills-${filters.day || 'all'}.csv`; a.click();
}

async function viewPrep(m) {
  const { from: sf, to: st } = dayRange(filters.speedDay || new Date().toLocaleDateString('en-CA'));
  const [{ staff, bills, free = [] }, speed] = await Promise.all([api('GET', '/api/preparing'), api('GET', '/api/prep-speed?' + new URLSearchParams({ from: sf, to: st }))]);
  const pr = (b) => b.stages.PR || {};
  // Bills and items each employee has in Preparing right now.
  const totals = {};
  for (const b of bills) { const n = pr(b).start_by_name || '?'; const t = (totals[n] ||= { bills: 0, items: 0 }); t.bills++; t.items += b.items || 0; }
  // Employee summary (like the speed dashboard): in-process items now, start, estimated finish, completed items and speed.
  const PREP_TARGET = 2;
  const summaryHtml = () => {
    const day = filters.speedDay || new Date().toLocaleDateString('en-CA'), isToday = day === new Date().toLocaleDateString('en-CA');
    const rows = {};
    const get = (n) => (rows[n] ||= { name: n, inItems: 0, inBills: 0, start: null, done: 0, minutes: 0, doneBills: 0, speed: 0 });
    if (isToday) for (const b of bills) { const e = pr(b), r = get(e.start_by_name || '?'); r.inItems += b.items || 0; r.inBills++; if (!r.start || e.start_at < r.start) r.start = e.start_at; }
    for (const p of speed) { const r = get(p.name); r.done = p.items; r.minutes = p.minutes; r.doneBills = p.bills; r.speed = p.per_min; }
    for (const r of Object.values(rows)) {
      // EAT: they should be back by preparing at least 2 items a minute.
      const sp = PREP_TARGET;
      if (r.inItems && sp) { r.eat = new Date(Date.parse(r.start) + (r.inItems / sp) * 60000).toISOString(); r.left = Math.max(0, Math.round((Date.parse(r.eat) - Date.now()) / 60000)); }
    }
    const list = Object.values(rows).sort((a, b) => (b.inItems > 0) - (a.inItems > 0) || (a.start || '').localeCompare(b.start || '') || b.done - a.done);
    const sum = (k) => list.reduce((n, r) => n + r[k], 0);
    const stat = (n, label) => `<div class="stat"><b>${n}</b><span>${label}</span></div>`;
    return `<section class="card"><div class="row"><h2 class="grow" style="margin:0">Employee summary</h2><input type="date" id="spd" value="${day}"></div>
      <div class="stats" style="margin:12px 0">${stat(sum('done') + sum('inItems'), 'Total items')}${stat(sum('done'), 'Done items')}${stat(sum('inItems'), 'In process items')}${stat(sum('doneBills') + sum('inBills'), 'Entries (bills)')}</div>
      ${list.length ? `<div class="scroll"><table><tr><th>Employee</th><th>In process items</th><th>Active start time</th><th>EAT</th><th>Minutes left</th><th>Completed items</th><th>Total items</th><th>Entries</th><th>Completed speed¹</th></tr>
      ${list.map((r) => `<tr><td><b>${esc(r.name)}</b></td><td>${r.inItems ? `<span class="pill amber">${r.inItems}</span>` : '0'}</td><td>${r.start ? `<b>${fmtTime(r.start)}</b>` : '—'}</td>
        <td>${r.eat ? fmtTime(r.eat) : '—'}</td><td>${r.eat ? `<b class="${r.left === 0 ? 'late' : ''}">${r.left === 0 ? 'Due now' : r.left + ' min'}</b>` : '—'}</td>
        <td><b>${r.done}</b></td><td>${r.done + r.inItems}</td><td>${r.doneBills + r.inBills}</td><td>${r.speed ? `<b class="${r.speed < PREP_TARGET ? 'late' : ''}">${r.speed.toFixed(2)}</b>` : '—'}</td></tr>`).join('')}
      </table></div>` : '<p class="empty">No Preparing bills on this day.</p>'}
      <p class="sub" style="margin:10px 0 0">¹ Items per minute on finished bills. Bills prepared together count as one batch (items ÷ minutes from first start to last end). "All done" bills are left out.
      EAT (estimated arrival time) = active start + in-process items ÷ ${PREP_TARGET} items per minute, the minimum speed. Speeds below ${PREP_TARGET} are shown in red.</p></section>`;
  };
  const totalLine = (name) => { const t = totals[name]; return t ? `<b>${esc(name)}</b> is preparing <b>${t.bills} bill${t.bills > 1 ? 's' : ''} · ${t.items} items</b> now` : `<b>${esc(name)}</b> has no bills in Preparing now`; };
  const side = `<aside class="card idlelist"><h2>No bills given · ${free.length}</h2><p class="sub">Sale items team with no bill in Preparing. Tap a name to pick them.</p>
    ${free.map((x) => `<div class="idle-name" data-pick="${esc(x.name)}" style="cursor:pointer">${esc(x.name)}${x.doing ? `<small class="who">${esc(x.doing)}</small>` : ''}</div>`).join('') || '<p class="empty">Everyone has bills.</p>'}</aside>`;
  m.innerHTML = `<div class="withside"><div><section class="card"><h2>Preparing Sale Items · new entry</h2>
    <form id="prepform" class="row" style="flex-wrap:wrap">
      <select name="who" required style="flex:1 1 140px"><option value="">Employee…</option>${staff.map((x) => `<option value="${x.id}" ${x.id === state.prepWho ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
      <input name="no" class="billno" placeholder="Bill no. e.g. 50810" maxlength="8" autocapitalize="characters" autocomplete="off" required style="flex:1 1 120px">
      <input name="items" class="items-in" type="number" inputmode="numeric" min="1" max="9999" placeholder="Items" required>
      <button class="btn">Submit</button></form>
    <p class="sub" style="margin:6px 0 0">Starts Preparing for that employee at the current time. Press End below when they finish.</p>
    <p id="preptotal" class="pill amber" style="margin-top:8px;font-size:14px;${state.prepWho ? '' : 'display:none'}">${state.prepWho ? totalLine((staff.find((x) => x.id === state.prepWho) || {}).name) : ''}</p></section>
    <section class="card"><h2>Being prepared now · ${bills.length} bills · ${bills.reduce((n, b) => n + (b.items || 0), 0)} items</h2>
    <div class="chips" style="margin-bottom:10px">${Object.entries(totals).sort((a, b) => b[1].items - a[1].items).map(([n, t]) => `<span class="chip off" style="border-style:solid;cursor:pointer" data-who="${esc(n)}">${esc(n)}<small>${t.bills} bill${t.bills > 1 ? 's' : ''} · ${t.items} items</small></span>`).join('')}</div>
    <input id="prepsearch" class="billsearch" placeholder="Search employee name or bill no." value="${esc(filters.prep || '')}" autocapitalize="characters" autocomplete="off">
    ${bills.map((b) => { const e = pr(b); return `<div class="bill" data-no="${esc(b.bill_no + ' ' + (e.start_by_name || ''))}"><div class="no">#${esc(b.bill_no)}${itemsTag(b)}</div>
      <div class="info"><b style="color:var(--text)">${esc(e.start_by_name || '')}</b> · started ${fmtTime(e.start_at)} · ${ago(e.start_at)}${e.entered_by_name ? ` <small>(entered by ${esc(e.entered_by_name)})</small>` : ''}</div>
      ${editBtn(b.id, b.bill_no, b.items)}${allDoneBtn(b)}<button class="btn amber" data-end="${b.id}">End</button></div>`; }).join('') || '<p class="empty">No bills being prepared.</p>'}
    </section>
    ${summaryHtml()}</div>${side}</div>`;
  $('#spd').onchange = (e) => { filters.speedDay = e.target.value; loadTab(); };
  const f = $('#prepform');
  f.no.oninput = () => { f.no.value = f.no.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); };
  f.who.onchange = () => {
    state.prepWho = +f.who.value || null;
    const el = $('#preptotal'), who = staff.find((x) => x.id === state.prepWho);
    el.style.display = who ? '' : 'none'; el.innerHTML = who ? totalLine(who.name) : '';
  };
  f.onsubmit = (e) => {
    e.preventDefault();
    const no = padBillNo(f.no.value.trim().toUpperCase()), items = Number(f.items.value);
    if (!/^([TR]\d{6}|[A-Z]{2}\d{6})$/.test(no)) return toast('Type the digits (50810, or 7656 for challan CA007656), a full bill no. like T050810, or a challan no. like CA007536', true);
    if (!Number.isInteger(items) || items < 1) return toast('Type the number of items', true);
    const who = staff.find((x) => x.id === +f.who.value);
    act(f.querySelector('button'), () => apiFor(who.id, 'POST', '/api/bills', { bill_no: no, items }), `${no} started for ${who.name}`);
  };
  const filter = () => {
    const q = $('#prepsearch').value.trim().toUpperCase(); filters.prep = q;
    m.querySelectorAll('.bill[data-no]').forEach((r) => { r.hidden = q && !r.dataset.no.toUpperCase().includes(q) && !r.dataset.no.startsWith(padBillNo(q)); });
  };
  $('#prepsearch').oninput = filter; filter();
  m.onclick = (e) => {
    const ed = e.target.closest('button[data-edit]'); if (ed) return editBill(ed);
    const wc = e.target.closest('[data-who]'); if (wc) { $('#prepsearch').value = wc.dataset.who; return filter(); }
    const pk = e.target.closest('[data-pick]');
    if (pk) { const who = staff.find((x) => x.name === pk.dataset.pick); if (who) { f.who.value = who.id; f.who.onchange(); f.no.focus(); } return; }
    const en = e.target.closest('button[data-end]');
    if (en) act(en, () => api('POST', '/api/stage', { bill_id: +en.dataset.end, task_code: 'PR', action: 'end' }), 'Ended at ' + fmtTime(new Date().toISOString()));
  };
}

// ---------- Quick Preparing Entry (FARAZ): big name buttons, number keypad, one tap to start ----------
// The form is drawn once; names and the running list refresh in place, so the keypad stays open between bills.
async function viewQuick(m) {
  let data = await api('GET', '/api/preparing');
  const pr = (b) => b.stages.PR || {};
  const sumItems = (l) => l.reduce((n, b) => n + (b.items || 0), 0);
  const plural = (n) => `${n} bill${n > 1 ? 's' : ''}`;
  const whoNow = () => data.staff.find((x) => x.id === state.quickWho);
  const byName = () => { const o = {}; for (const b of data.bills) (o[pr(b).start_by_name] ||= []).push(b); return o; };
  const namesHtml = () => {
    const by = byName(), w = whoNow();
    return data.team.map((n) => data.staff.find((x) => x.name === n)).filter(Boolean).map((x) => { const l = by[x.name] || [];
      return `<button type="button" class="qk-name ${l.length ? '' : 'free'} ${w && w.id === x.id ? 'on' : ''}" data-q="${x.id}">${esc(x.name)}<small>${l.length ? `${plural(l.length)} · ${sumItems(l)} items` : 'Free'}</small></button>`; }).join('');
  };
  const listHtml = () => {
    const groups = Object.entries(byName()).sort((a, b) => a[0].localeCompare(b[0]));
    return `<h2>Being prepared now · ${plural(data.bills.length)} · ${sumItems(data.bills)} items</h2>` + (groups.map(([n, l]) => `<div class="qk-group"><h3>${esc(n)} <small>${plural(l.length)} · ${sumItems(l)} items</small></h3>
      ${l.map((b) => `<div class="qk-bill"><b>${esc(b.bill_no)}</b><span class="grow">${b.items || '?'} items · ${fmtTime(pr(b).start_at)} · ${ago(pr(b).start_at)}</span><button class="btn amber" data-qend="${b.id}">End</button></div>`).join('')}</div>`).join('') || '<p class="empty">No bills being prepared.</p>');
  };
  const others = data.staff.filter((x) => !data.team.includes(x.name));
  m.innerHTML = `<div class="qk">
    <section class="card"><h2>1 · Who is preparing?</h2><div class="qk-names" id="qknames">${namesHtml()}</div>
      ${others.length ? `<select id="qkother" style="width:100%;margin-top:10px"><option value="">Someone else…</option>${others.map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>` : ''}</section>
    <section class="card"><form id="qkform" class="qk-form" autocomplete="off">
      <h2 style="margin:0">2 · Bill and items</h2>
      <div class="qk-who" id="qkwho"></div>
      <div class="qk-field"><label>Bill no. (digits only · below 15000 = challan CA)</label><input name="no" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="50810" enterkeyhint="next"><div class="qk-prev" id="qkprev"></div></div>
      <div class="qk-field"><label>Items</label><input name="items" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0" enterkeyhint="go"></div>
      <button class="qk-go">Start preparing ▶</button>
      <div id="qkdone"></div>
    </form></section>
    <section class="card" id="qklist">${listHtml()}</section></div>`;
  const f = $('#qkform');
  const showWho = () => {
    const w = whoNow();
    $('#qkwho').innerHTML = w ? esc(w.name) : '<span class="sub">Tap a name above</span>';
    f.querySelector('.qk-go').disabled = !w;
    m.querySelectorAll('[data-q]').forEach((b) => b.classList.toggle('on', w && +b.dataset.q === w.id));
    if ($('#qkother')) $('#qkother').value = w && !data.team.includes(w.name) ? w.id : '';
  };
  const refresh = async () => { data = await api('GET', '/api/preparing'); $('#qknames').innerHTML = namesHtml(); $('#qklist').innerHTML = listHtml(); showWho(); };
  showWho();
  if (state.quickDone) $('#qkdone').innerHTML = `<div class="qk-done">✓ ${esc(state.quickDone)}</div>`;
  const digits = (el) => { el.value = el.value.replace(/\D/g, ''); };
  f.no.oninput = () => {
    digits(f.no);
    const full = padBillNo(f.no.value);
    $('#qkprev').textContent = full !== f.no.value ? '→ ' + full : '';
    if (f.no.value.length === 5) f.items.focus();
  };
  f.items.oninput = () => digits(f.items);
  f.no.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); f.items.focus(); } };
  // Picking a name focuses the bill box straight away, so the number keypad opens.
  const pick = (id) => { state.quickWho = id; $('#qkdone').innerHTML = ''; showWho(); f.no.focus(); };
  if ($('#qkother')) $('#qkother').onchange = (e) => e.target.value && pick(+e.target.value);
  f.onsubmit = async (e) => {
    e.preventDefault();
    const w = whoNow();
    if (!w) return toast('Tap a name first', true);
    if (padBillNo(f.no.value) === f.no.value) { toast('Type the bill no.: 5 digits, or below 15000 for a challan', true); return f.no.focus(); }
    const items = Number(f.items.value);
    if (!items) { toast('Type the number of items', true); return f.items.focus(); }
    const no = padBillNo(f.no.value), btn = f.querySelector('.qk-go');
    // Ready for the next bill at once: clear and jump back to the bill box (keypad stays up).
    f.no.value = ''; f.items.value = ''; $('#qkprev').textContent = ''; f.no.focus();
    btn.disabled = true;
    try {
      await apiFor(w.id, 'POST', '/api/bills', { bill_no: no, items });
      state.quickDone = `${no} · ${items} items started for ${w.name}`;
      $('#qkdone').innerHTML = `<div class="qk-done">✓ ${esc(state.quickDone)}</div>`;
      await refresh();
    } catch (err) { toast(err.message, true); f.no.value = no.slice(-5); f.items.value = items; }
    finally { btn.disabled = !whoNow(); }
  };
  m.onclick = async (e) => {
    const q = e.target.closest('[data-q]'); if (q) return pick(+q.dataset.q);
    const en = e.target.closest('button[data-qend]');
    if (!en) return;
    en.disabled = true;
    try { await api('POST', '/api/stage', { bill_id: +en.dataset.qend, task_code: 'PR', action: 'end' }); toast('Ended at ' + fmtTime(new Date().toISOString())); await refresh(); }
    catch (err) { toast(err.message, true); en.disabled = false; }
  };
}

// ---------- Orders (owner and Ajanta): company orders, payment due per day, orders left to place ----------
// Owner's rules (2026-10-31): due days counted with the order day as day 1 (order on 1st with 21 days -> pay on 21st; 0 days = same day).
// No orders on Saturday or Sunday. Order frequency from the company list: twice a week, weekly, biweekly (every 2 weeks), once a month; auto = no planning.
const ODAY = 864e5;
const oAdd = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * ODAY).toISOString().slice(0, 10);
const oDow = (d) => new Date(d + 'T00:00:00Z').getUTCDay();
const oDiff = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / ODAY);
const oDue = (d, days) => oAdd(d, Math.max(0, days - 1));
const oNow = () => new Date(Date.now() + 330 * 60000).toISOString().slice(0, 16);
const oFmt = (d, o = { weekday: 'short', day: 'numeric', month: 'short' }) => new Date(d + 'T00:00:00Z').toLocaleDateString('en-IN', { ...o, timeZone: 'UTC' });
const FREQ = {
  'twice a week': { per: 2, period: 'week', gap: 3, label: 'Twice a week' },
  weekly: { per: 1, period: 'week', gap: 7, label: 'Weekly' },
  biweekly: { per: 1, period: '14 days', gap: 14, label: 'Every 2 weeks' },
  'once a month': { per: 1, period: 'month', gap: 'month', label: 'Once a month' },
  auto: { per: 0, label: 'Auto' },
};
const FREQ_ORDER = ['twice a week', 'weekly', 'biweekly', 'once a month', 'auto'];
let orderData = null;

function orderPlan(d, horizon) {
  const today = d.today, end = oAdd(today, horizon - 1);
  const periodsOn = (x) => d.periods.filter((p) => p.from_date <= x && x <= p.to_date);
  const noOrder = (x) => oDow(x) === 0 || oDow(x) === 6 || periodsOn(x).some((p) => p.no_orders);
  const nextWork = (x) => { for (let i = 0; i < 60 && noOrder(x); i++) x = oAdd(x, 1); return x; };
  const addGap = (x, f) => f.gap === 'month' ? (() => { const [y, m, dd] = x.split('-').map(Number); const t = new Date(Date.UTC(y, m, Math.min(dd, 28))); return t.toISOString().slice(0, 10); })() : oAdd(x, f.gap);
  // Periods are counted from the next order day, so on a weekend "this week" means the coming week.
  const ref = nextWork(today);
  const workLeft = (to) => { let n = 0; for (let x = ref; x <= to; x = oAdd(x, 1)) if (!noOrder(x)) n++; return n; };
  const weekStart = oAdd(ref, -((oDow(ref) + 6) % 7)), weekEnd = oAdd(weekStart, 6);
  let lastWork = weekEnd; while (lastWork > ref && noOrder(lastWork)) lastWork = oAdd(lastWork, -1);
  const byCo = {};
  for (const o of d.orders) (byCo[o.company_id] ||= []).push({ ...o, date: o.ordered_at.slice(0, 10), due: oDue(o.ordered_at.slice(0, 10), o.due_days) });
  const days = {};
  for (let x = today; x <= end; x = oAdd(x, 1)) days[x] = { date: x, placed: [], planned: [], periods: periodsOn(x) };
  for (const list of Object.values(byCo)) for (const o of list) if (days[o.due]) days[o.due].placed.push(o);
  const cos = d.companies.filter((c) => c.active).map((c) => {
    const f = FREQ[c.category] || FREQ.auto, list = byCo[c.id] || [], last = list[0];
    const avg = list.length ? list.slice(0, 5).reduce((n, o) => n + o.amount, 0) / Math.min(5, list.length) : 0;
    const r = { ...c, f, list, last, avg, payToday: oDue(nextWork(today), c.due_days) };
    r.payPeriods = periodsOn(r.payToday);
    if (!f.per) return r;
    // Owner (2026-10-31): orders left are counted per week (Mon-Sun). Twice-a-week companies are the big ones: 2 orders spread over the week.
    r.done = list.filter((o) => o.date >= weekStart && o.date <= weekEnd).length;
    r.workLeft = workLeft(weekEnd);
    const rolling = last ? addGap(last.date, f) : today;
    r.late = rolling < today ? oDiff(rolling, today) : 0;
    let next = nextWork(rolling < ref ? ref : rolling);
    if (f.period === 'week') {
      r.per = f.per; r.left = Math.max(0, f.per - r.done);
      if (!r.left) next = nextWork(oAdd(weekEnd, 1));
      else if (next > lastWork && lastWork >= ref && (!last || last.date < lastWork)) next = lastWork; // fit the order(s) left into this week
    } else {
      // Every 2 weeks / once a month: needed this week only when the next order falls in this week.
      r.per = next <= weekEnd || r.done ? 1 : 0; r.left = r.done ? 0 : r.per;
    }
    r.next = next;
    for (let x = r.next, i = 0; x <= end && i < 40; x = nextWork(addGap(x, f)), i++) {
      const due = oDue(x, c.due_days);
      if (days[due]) days[due].planned.push({ company: c.name, date: x, due, amount: r.avg });
    }
    return r;
  });
  return { days: Object.values(days), cos, today, weekEnd, noOrder, periodsOn, nextWork };
}

async function viewOrders(m) {
  const d = orderData = await api('GET', '/api/orders');
  const horizon = filters.oDays || 15, P = orderPlan(d, horizon), today = d.today;
  const coName = Object.fromEntries(d.companies.map((c) => [c.id, c.name])), oName = (o) => o.company_id ? coName[o.company_id] : o.name + ' (manual)';
  const tags = (ps) => ps.map((p) => `<span class="pill ${p.no_orders ? 'red' : 'purple'}">${esc(p.label)}</span>`).join(' ');
  const max = Math.max(1, ...P.days.map((x) => x.placed.reduce((n, o) => n + o.amount, 0) + x.planned.reduce((n, o) => n + o.amount, 0)));
  const sum = (l) => l.reduce((n, o) => n + o.amount, 0);
  const tot = (n) => P.days.slice(0, n).reduce((a, x) => a + sum(x.placed) + sum(x.planned), 0);
  const plan = P.cos.filter((c) => c.f.per);
  // On a Saturday, Sunday or no-order day, "today" means the next order day.
  const oday = P.nextWork(today), odayLabel = oday === today ? 'today' : oFmt(oday);
  const orderToday = plan.filter((c) => c.next === oday);
  const leftWeek = plan.reduce((n, c) => n + c.left, 0);
  const show = filters.oShow || 'all', q = (filters.oq || '').toUpperCase();
  const rows = plan.filter((c) => show === 'today' ? c.next === oday : show === 'left' ? c.left > 0 : true)
    .sort((a, b) => FREQ_ORDER.indexOf(a.category) - FREQ_ORDER.indexOf(b.category) || b.left - a.left || a.next.localeCompare(b.next) || b.late - a.late || b.avg - a.avg);
  const dayRow = (x) => {
    const pl = sum(x.placed), pn = sum(x.planned), we = oDow(x.date) === 0 || oDow(x.date) === 6, open = filters.oOpen === x.date;

// ---------- Debtors (owners): upload Debtors.xls, see day-wise totals and the top 100 ----------
// Remembers the linked Debtors file (a browser file handle) in this browser's IndexedDB.
function handleStore(op, value) {
  return new Promise((ok) => {
    try {
      const req = indexedDB.open('vma', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('files');
      req.onerror = () => ok(null);
      req.onsuccess = () => {
        const tx = req.result.transaction('files', op === 'get' ? 'readonly' : 'readwrite'), st = tx.objectStore('files');
        const r = op === 'get' ? st.get('debtors') : st.put(value, 'debtors');
        r.onsuccess = () => ok(op === 'get' ? r.result || null : true); r.onerror = () => ok(null);
      };
    } catch { ok(null); }
  });
}
const rupees = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
const loadXlsx = () => window.XLSX ? Promise.resolve() : new Promise((ok, bad) => { const sc = document.createElement('script'); sc.src = '/xlsx.full.min.js'; sc.onload = ok; sc.onerror = () => bad(new Error('Could not load the Excel reader')); document.head.appendChild(sc); });
// Sheet names are days like "18 OCTOBER" (no year: the latest such date not after tomorrow), or 18-10-2026 / 2026-10-18.
function sheetDate(name) {
  const t = name.trim().toUpperCase(), MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const iso = (y, m, d) => (m >= 1 && m <= 12 && d >= 1 && d <= 31 ? `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}` : null);
  let m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/.exec(t); if (m) return iso(+m[1], +m[2], +m[3]);
  m = /^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/.exec(t); if (m) return iso(m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[2], +m[1]);
  m = /^(\d{1,2})\s*[-/.]?\s*([A-Z]{3})[A-Z]*\.?\s*[-/,]?\s*(\d{4})?$/.exec(t);
  if (m && MON.includes(m[2])) {
    const mon = MON.indexOf(m[2]) + 1; if (m[3]) return iso(+m[3], mon, +m[1]);
    const limit = new Date(Date.now() + 864e5).toLocaleDateString('en-CA'); let y = new Date().getFullYear();
    while (iso(y, mon, +m[1]) > limit) y--;
    return iso(y, mon, +m[1]);
  }
  return null;
}
// Columns: LEDGER (party name padded to 30 characters, then area), GROUP, DEBIT (balance), CREDIT. Owner's rule: only rows with "due" in the CREDIT column count.
function readDebtorsBook(wb) {
  const days = [], skipped = [];
  for (const name of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true });
    const date = sheetDate(name);
    const head = (rows[0] || []).map((h) => String(h || '').trim().toUpperCase());
    const ci = (k, d) => { const i = head.indexOf(k); return i < 0 ? d : i; };
    const L = ci('LEDGER', 0), G = ci('GROUP', 1), D = ci('DEBIT', 2), C = ci('CREDIT', 3);
    if (!date) { skipped.push(name); continue; }
    const out = [];
    for (const r of rows.slice(1)) {
      const led = String(r[L] || ''), amt = Number(r[D]);
      if (!led.trim() || !Number.isFinite(amt) || !amt || !/due/i.test(String(r[C] || ''))) continue;
      out.push({ party: (led.length > 30 ? led.slice(0, 30) : led).trim(), area: led.length > 30 ? led.slice(30).trim() : '', grp: String(r[G] || '').trim(), amount: amt, due: /due/i.test(String(r[C] || '')) });
    }
    const same = days.find((d) => d.date === date);
    if (same) same.rows = out; else days.push({ date, rows: out });
  }
  return { days, skipped };
}

  const sumTop = d.top.reduce((n, r) => n + r.amount, 0), day = d.days.find((x) => x.date === d.date);
  // Edge / Chrome on a computer can remember the file, so Refresh re-reads it in one tap.

      ${canLink ? `<p class="sub" style="margin:8px 0 0">${linked ? `Linked to <b>${esc(linked.name)}</b> on this computer. Save the Excel file, then press <b>Refresh</b>.` : 'Press <b>Refresh</b> once and choose your Debtors.xls. After that, Refresh reads the same file again in one tap.'}</p>` : ''}</section>
    ${d.days.length ? `<section class="card"><h2>Day-wise due debtors total · ${d.days.length} days</h2><div class="scroll"><table>

        <td class="rs">${d.days[i + 1] ? change(x.total, d.days[i + 1].total) : '—'}</td><td class="rs">${x.accounts}</td>
        <td><div class="dbar" style="width:${(x.total / max * 100).toFixed(1)}%"></div></td></tr>`).join('')}
      </table></div><p class="sub" style="margin:8px 0 0">Tap a day to see its top 100.</p></section>
    <section class="card"><div class="row" style="flex-wrap:wrap"><h2 class="grow" style="margin:0">Top 100 due debtors · ${fmtDay(d.date)}</h2>

      <p class="sub">Top 100 total <b>${rupees(sumTop)}</b>${day ? ` · ${(sumTop / day.total * 100).toFixed(1)}% of ${rupees(day.total)}` : ''}${d.prev ? ` · change compared with ${fmtDay(d.prev)}` : ''}</p>

      <div class="scroll"><table><tr><th>#</th><th>Party</th><th>Area</th><th>Group</th><th class="rs">Amount</th><th class="rs">Change</th></tr>
      ${d.top.map((r, i) => `<tr data-q="${esc((r.party + ' ' + r.area + ' ' + r.grp).toUpperCase())}"><td>${i + 1}</td><td><b>${esc(r.party)}</b></td><td>${esc(r.area)}</td>

// ---------- Verify Racks (Arun, owners): tick each rack, tube rack and syrup case ----------
async function viewItems(m) {
  const jobs = await api('GET', '/api/item-verify');

  const waiting = jobs.reduce((n, j) => n + items(j).filter((x) => !x.v).length, 0);
  m.innerHTML = `<section class="card"><h2>Verify racks, tube racks and syrup cases · ${waiting} waiting</h2>
    <p class="sub">Last 3 days. Tap each rack or case after checking it. Arun or Sonu verifying an item is enough; it shows ✓ with their name. When every item of a finished job is ticked, the whole job is verified.</p></section>
    ${jobs.map((j) => { const l = items(j), left = l.filter((x) => !x.v).length; return `<section class="card"><div class="row" style="flex-wrap:wrap"><span class="code">${j.task_code}</span>
      <div class="grow"><b>${esc(j.start_by_name || '')}</b> · ${esc(j.task_name)}<div class="sub" style="margin:0">${fmtFull(j.start_at)} – ${j.end_at ? fmtTime(j.end_at) : 'running'} · ${l.length - left} of ${l.length} verified${j.verified_at ? ` · <span class="pill green">✓ Job verified by ${esc(j.verified_by_name || '')}</span>` : ''}</div></div>
      ${left ? `<button class="btn green small" data-vall="${j.id}">Verify all ${left}</button>` : `<button class="btn ghost small" data-vundo="${j.id}">Undo all</button>`}</div>
      <div class="rk" style="margin-top:10px">${l.map((x) => `<button type="button" data-vk="${x.kind}" data-vid="${x.id}" data-v="${x.v ? 1 : ''}" style="${x.v ? 'background:var(--green-bg);border-color:var(--green)' : ''}">${esc(x.label)} <span>${x.v ? '✓ ' + esc(x.by || '') : 'tap'}</span></button>`).join('')}</div></section>`; }).join('') || '<section class="card"><p class="empty">No rack, tube rack or syrup case lists in the last 3 days.</p></section>'}`;
  m.onclick = (e) => {
    const b = e.target.closest('[data-vk]');

    const a = e.target.closest('[data-vall]'); if (a) return act(a, () => api('POST', '/api/item-verify', { entry_id: +a.dataset.vall }), 'All verified');
    const u = e.target.closest('[data-vundo]'); if (u && confirm('Untick every item of this job?')) return act(u, () => api('POST', '/api/item-verify', { entry_id: +u.dataset.vundo, undo: true }), 'Unticked');
  };
}

async function viewIncentive(m) {

  else { const a = filters.incFrom || today, z = filters.incTo && filters.incTo >= a ? filters.incTo : a; range = { from: dayRange(a).from, to: dayRange(z).to }; }
  const fromStr = filters.incFrom || today, toStr = filters.incTo && filters.incTo >= fromStr ? filters.incTo : fromStr;
  const days = await api('GET', '/api/incentive?' + new URLSearchParams(range));
  const rs = (n) => n ? `<b>₹${n}</b>` : '<span class="sub">—</span>';
  const stat = (n, label) => `<div class="stat"><b>${n}</b><span>${label}</span></div>`;

  const controls = `<section class="card"><div class="row" style="flex-wrap:wrap;gap:8px"><h2 class="grow" style="margin:0">Incentive</h2>
    <button class="btn small ${mode === 'day' ? '' : 'ghost'}" data-mode="day">Day</button><button class="btn small ${mode === 'month' ? '' : 'ghost'}" data-mode="month">Month</button><button class="btn small ${mode === 'range' ? '' : 'ghost'}" data-mode="range">From – to</button>
    ${mode === 'day' ? `<input type="date" id="incday" value="${dayStr}">` : mode === 'month' ? `<input type="month" id="incmon" value="${monStr}">`
      : `<input type="date" id="incfrom" value="${fromStr}"> to <input type="date" id="incto" value="${toStr}" min="${fromStr}">`}<button class="btn green small" id="incprint">🖨 Print</button>${mode === 'day' && state.me.is_admin ? '<button class="btn ghost small" id="incmail">✉ Email</button>' : ''}</div></section>`;
  let body, earners = [], title;
  if (mode === 'day') {
    const d = days[0] || { preppers: [], checkers: [], checked: 0 };
    const by = {};
    for (const p of d.preppers) if (p.total) Object.assign((by[p.name] ||= { name: p.name, items: 0, speed: 0, check: 0 }), { items: p.dayReward, speed: p.speedReward });
    for (const c of d.checkers) if (c.reward) (by[c.name] ||= { name: c.name, items: 0, speed: 0, check: 0 }).check = c.reward;
    earners = Object.values(by).map((r) => ({ ...r, total: r.items + r.speed + r.check })).sort((a, b) => b.total - a.total);
    title = 'Daily incentive · ' + new Date(dayStr + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const total = d.preppers.reduce((n, p) => n + p.total, 0) + d.checkers.reduce((n, c) => n + c.reward, 0);
    body = `<div class="stats" style="margin-bottom:12px">${stat('₹' + total, 'Total incentive')}${stat(d.preppers.filter((p) => p.total).length + d.checkers.filter((c) => c.reward).length, 'Rewards earned')}${stat(d.preppers.reduce((n, p) => n + p.items, 0), 'Items prepared')}${stat(d.checked, 'Items checked')}</div>
      <section class="card"><h2>Preppers</h2>${d.preppers.length ? `<div class="scroll"><table><tr><th>Employee</th><th class="rs">Bills</th><th class="rs">Items</th><th class="rs">Points</th><th class="rs">Counted items</th><th class="rs">Items reward</th><th>Speed bonus (50+ item bills)</th><th class="rs">Total</th></tr>
      ${d.preppers.map((p) => `<tr><td><b>${esc(p.name)}</b></td><td class="rs">${p.bills}</td><td class="rs">${p.items}</td><td class="rs">${p.points ? `<span class="late">${p.points}</span>` : '0'}</td>
        <td class="rs"><b>${p.adjusted}</b>${p.points ? ` <small class="sub">(−${p.points * 5})</small>` : ''}</td><td class="rs">${rs(p.dayReward)}</td>
        <td style="white-space:normal;min-width:220px">${(() => { const won = p.speedBills.filter((b) => b.reward);
          if (!p.speedBills.length) return '<small class="sub">No 50+ item bills</small>';
          return `<b>${rs(p.speedReward)}</b> <small class="sub">${won.length} of ${p.speedBills.length} bills</small>${won.length ? `<br><small>${won.map((b) => `${esc(b.bill_no)} ${b.speed}/min ₹${b.reward}`).join(' · ')}</small>` : ''}`; })()}</td>
        <td class="rs">${rs(p.total)}</td></tr>`).join('')}</table></div>` : '<p class="empty">No finished Preparing bills on this day.</p>'}</section>
      <section class="card"><h2>Checkers · ${d.checked} items checked</h2>${d.checkers.length ? `<div class="scroll"><table><tr><th>Employee</th><th class="rs">Bills</th><th class="rs">Items checked</th><th class="rs">Share of work</th><th class="rs">Reward</th></tr>
      ${d.checkers.map((c) => `<tr><td><b>${esc(c.name)}</b></td><td class="rs">${c.bills}</td><td class="rs">${c.items}</td><td class="rs"><b>${c.pct}%</b></td><td class="rs">${rs(c.reward)}</td></tr>`).join('')}</table></div>
      <p class="sub" style="margin:8px 0 0">When two people check a bill together, each gets half its items.</p>` : '<p class="empty">No finished Checking on this day.</p>'}</section>`;
  } else {
    const people = {};
    const get = (n) => (people[n] ||= { name: n, items: 0, speed: 0, check: 0, days: new Set() });
    for (const d of days) {
      for (const p of d.preppers) { const r = get(p.name); r.items += p.dayReward; r.speed += p.speedReward; if (p.total) r.days.add(d.date); }
      for (const c of d.checkers) { const r = get(c.name); r.check += c.reward; if (c.reward) r.days.add(d.date); }
    }
    const list = Object.values(people).map((r) => ({ ...r, total: r.items + r.speed + r.check })).filter((r) => r.total).sort((a, b) => b.total - a.total);
    const sum = list.reduce((n, r) => n + r.total, 0);
    const long = (x) => new Date(x + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
    earners = list; title = mode === 'month' ? 'Monthly incentive · ' + new Date(monStr + '-01T00:00:00').toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }) : `Incentive · ${long(fromStr)} to ${long(toStr)}`;
    body = `<div class="stats" style="margin-bottom:12px">${stat('₹' + sum, 'Total incentive')}${stat(list.length, 'Employees earning')}${stat(days.length, 'Working days')}</div>
      <section class="card"><h2>${mode === 'month' ? 'Month' : 'Period'} total by employee</h2>${list.length ? `<div class="scroll"><table><tr><th>Employee</th><th class="rs">Items reward</th><th class="rs">Speed bonus</th><th class="rs">Checking reward</th><th class="rs">Days earned</th><th class="rs">Total</th></tr>
      ${list.map((r) => `<tr><td><b>${esc(r.name)}</b></td><td class="rs">${rs(r.items)}</td><td class="rs">${rs(r.speed)}</td><td class="rs">${rs(r.check)}</td><td class="rs">${r.days.size}</td><td class="rs">${rs(r.total)}</td></tr>`).join('')}</table></div>` : `<p class="empty">No incentive earned ${mode === 'month' ? 'this month' : 'in these dates'} yet.</p>`}</section>
      <section class="card"><h2>Day by day</h2><div class="scroll"><table><tr><th>Date</th><th class="rs">Items prepared</th><th class="rs">Items checked</th><th class="rs">Incentive</th></tr>
      ${days.map((d) => `<tr data-incday="${d.date}" style="cursor:pointer"><td><b>${fmtDay(d.date)}</b></td><td class="rs">${d.preppers.reduce((n, p) => n + p.items, 0)}</td><td class="rs">${d.checked}</td>
        <td class="rs">${rs(d.preppers.reduce((n, p) => n + p.total, 0) + d.checkers.reduce((n, c) => n + c.reward, 0))}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">No days yet.</td></tr>'}</table></div><p class="sub" style="margin:8px 0 0">Tap a day to open it.</p></section>`;
  }
  const rules = `<section class="card"><h2>Rules</h2><p class="sub" style="margin:0">
    <b>Preppers:</b> more than 700 items in a day ₹50, more than 1100 ₹100 (the higher one replaces the lower). Each checking point cuts 5 items (705 items with 3 points counts as 690, so no reward).
    Speed above 3.25 items/min ₹10 per bill, above 4.5 ₹20 per bill, only on bills of 50 or more items; bills prepared at the same time share their batch speed.<br>
    <b>Checkers:</b> more than 30% of the day's checked items ₹100, more than 45% ₹150 (the higher one replaces the lower).<br>
    Days run midnight to midnight by the Preparing or Checking start time. "All done" steps are not counted.</p></section>`;
  m.innerHTML = controls + body + rules;
  m.querySelectorAll('[data-mode]').forEach((b) => { b.onclick = () => { filters.incMode = b.dataset.mode; loadTab(); }; });
  $('#incprint').onclick = () => printIncentive(title, earners);
  if ($('#incmail')) $('#incmail').onclick = (e) => { if (confirm(`Email the incentive sheet for ${dayStr} now?`)) act(e.target, async () => { const r = await api('POST', '/api/incentive/email', { date: dayStr }); toast('Emailed to ' + r.sent_to.join(', ')); }); };
  if ($('#incday')) $('#incday').onchange = (e) => { filters.incDay = e.target.value; loadTab(); };
  if ($('#incmon')) $('#incmon').onchange = (e) => { filters.incMonth = e.target.value; loadTab(); };
  if ($('#incfrom')) $('#incfrom').onchange = (e) => { filters.incFrom = e.target.value; loadTab(); };
  if ($('#incto')) $('#incto').onchange = (e) => { filters.incTo = e.target.value; loadTab(); };
  m.querySelectorAll('[data-incday]').forEach((tr) => { tr.onclick = () => { filters.incMode = 'day'; filters.incDay = tr.dataset.incday; loadTab(); }; });
}

// ---------- Final verification: bills with all three steps done, one Done button ----------
async function viewFinal(m) {
  const { stages: st, waiting, done } = await api('GET', '/api/final');
  const last = st[st.length - 1], before = st.slice(0, -1);
  const steps = (b) => before.map((t) => { const e = b.stages[t.code] || {}; return `<span class="pill green">✓ ${t.code}</span> ${esc(e.end_by_name || '')} ${fmtTime(e.end_at)}`; }).join(' &nbsp; ');
  m.innerHTML = `<section class="card"><h2>Waiting for final verification · ${waiting.length}</h2>
    <p class="sub">These bills have finished ${before.map((t) => esc(t.name)).join(', ')}. Check the bill on the computer and press Done.</p>
    <input id="billsearch" class="billsearch" placeholder="Find bill or challan no." autocapitalize="characters" autocomplete="off">
    ${waiting.map((b) => `<div class="bill" data-no="${esc(b.bill_no)}"><div class="no">#${esc(b.bill_no)}${itemsTag(b)}</div><div class="info">${steps(b)}</div>
      <button class="btn green" data-done="${b.id}">Done</button></div>`).join('') || '<p class="empty">No bills waiting.</p>'}
    </section>
    <section class="card"><h2>Verified in the last 24 hours · ${done.length}</h2>
    ${done.map((b) => { const e = b.stages[last.code]; return `<div class="bill" data-no="${esc(b.bill_no)}"><div class="no">#${esc(b.bill_no)}</div><div class="info"><span class="pill green">✓ Done</span> by ${esc(e.end_by_name)} at ${fmtTime(e.end_at)}</div></div>`; }).join('') || '<p class="empty">None yet.</p>'}
    </section>`;
  $('#billsearch').oninput = (e) => { const q = e.target.value.trim().toUpperCase(); m.querySelectorAll('.bill[data-no]').forEach((r) => { r.hidden = q && !r.dataset.no.includes(q); }); };

}

// ---------- Staff status: who hasn't logged a job ----------
async function viewStatus(m) {
  const { from, to } = dayRange(filters.day);
  const rows = await api('GET', '/api/admin/staff-status?' + new URLSearchParams(from ? { from, to } : {}));
  const isToday = filters.day === new Date().toLocaleDateString('en-CA');
  const seen = (r) => r.last_seen && (!from || (r.last_seen >= from && r.last_seen < to));
  const idle = rows.filter((r) => !r.jobs);
  const doing = (r) => r.running ? `<span class="pill amber">${r.running.task_code}</span> ${esc(r.running.task_name)}${r.running.bill_no ? ' · ' + esc(r.running.bill_no) : ''} · ${ago(r.running.start_at)}` : '';
  // Search an employee: what they are doing right now, or their last job.
  const found = () => {
    const q = (filters.staffq || '').trim().toUpperCase();
    if (!q) return '';
    const hits = rows.filter((r) => r.name.toUpperCase().includes(q) || r.username.toUpperCase().includes(q));
    return hits.map((r) => { const l = r.last_entry; return `<div class="bill"><div class="no" style="min-width:110px;font-size:16px">${esc(r.name)}</div><div class="info" style="color:var(--text)">
      ${r.running ? `<b>Doing now:</b> ${doing(r)} <small class="sub">(started ${fmtTime(r.running.start_at)})</small>` : `<span class="pill gray">Nothing running</span>${l ? ` Last job: <span class="code">${l.task_code}</span> ${esc(l.task_name)}${l.bill_no ? ' · ' + esc(l.bill_no) : ''}, finished ${fmtFull(l.end_at || l.start_at)}` : ' No jobs yet'}`}
      <div class="sub" style="margin:2px 0 0">${r.last_seen ? 'Last opened the app ' + fmtFull(r.last_seen) : 'Has never logged in'}</div></div></div>`; }).join('') || '<p class="empty">No employee with that name.</p>';
  };
  m.innerHTML = `<div class="card row"><input id="sq" class="grow" placeholder="Search employee, e.g. vicky" value="${esc(filters.staffq || '')}" autocomplete="off"><input type="date" id="fd" value="${filters.day}"></div>
    <div id="sres"></div>
    <section class="card fixlist"><h2>No job logged ${isToday ? 'today' : 'on ' + esc(filters.day)} · ${idle.length} of ${rows.length}</h2>
      <p class="sub">These people have not started or finished any bill step or task${isToday ? ' yet today' : ''}.</p>
      ${idle.map((r) => `<div class="bill"><div class="no" style="min-width:110px;font-size:16px">${esc(r.name)}</div>
        <div class="info">${seen(r) ? `Opened the app at ${fmtTime(r.last_seen)}, but no job` : r.last_seen ? `Not opened the app ${isToday ? 'today' : 'that day'} (last ${fmtFull(r.last_seen)})` : 'Has never logged in'}</div></div>`).join('') || '<p class="empty">Everyone has logged a job.</p>'}
    </section>
    <section class="card scroll"><h2>Everyone</h2><table><tr><th>Employee</th><th>Jobs</th><th>Last job</th><th>Doing now</th><th>Last seen</th></tr>
      ${rows.map((r) => `<tr><td><b>${esc(r.name)}</b><small>${esc(r.tasks.join(', '))}</small></td><td>${r.jobs || '<span class="pill amber">0</span>'}</td><td>${r.last_job ? fmtTime(r.last_job) : ''}</td><td>${doing(r)}</td><td>${r.last_seen ? fmtFull(r.last_seen) : 'Never'}</td></tr>`).join('')}
    </table></section>`;
  const showFound = () => { const h = found(); $('#sres').innerHTML = h ? `<section class="card"><h2>Search result</h2>${h}</section>` : ''; };
  showFound();
  $('#sq').oninput = (e) => { filters.staffq = e.target.value; showFound(); };
  $('#fd').onchange = (e) => { filters.day = e.target.value; loadTab(); };
}
