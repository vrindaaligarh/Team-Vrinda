<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bill Tracker</title>
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bill Tracker">
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6ea;
    --primary: #1f6feb; --primary-text: #fff; --green: #1a7f37; --green-bg: #e6f4ea;
    --amber: #9a6700; --amber-bg: #fff4d6; --red: #c62828; --red-bg: #fde8e8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1b1f25; --text: #e6e8eb; --muted: #9aa3ad; --line: #2c323a;
      --primary: #4c8dff; --green: #5bd17a; --green-bg: #173322; --amber: #f0c050; --amber-bg: #3a2e10;
      --red: #ff7b72; --red-bg: #3d1a1a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 16px 0; max-width: 1200px; margin: 0 auto; }
  nav button { background: none; border: 0; padding: 8px 12px; border-radius: 8px; color: var(--muted); font-weight: 600; cursor: pointer; font-size: 14px; }
  nav button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  main { max-width: 1200px; margin: 0 auto; padding: 12px 16px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 4px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .code { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 8px; background: var(--primary); color: var(--primary-text); font-weight: 700; font-size: 14px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  button.btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 700; font-size: 15px; cursor: pointer; background: var(--primary); color: var(--primary-text); }
  button.btn.green { background: var(--green); color: #fff; }
  button.btn.amber { background: #d29922; color: #1d1600; }
  button.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 600; }
  button.btn.small { padding: 5px 10px; font-size: 13px; }
  button.btn:disabled { opacity: .5; cursor: wait; }
  input, select { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--text); min-width: 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .bill { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .bill:first-of-type { border-top: 0; }
  .bill .no { font-size: 18px; font-weight: 700; min-width: 90px; }
  .bill .info { flex: 1; color: var(--muted); font-size: 13px; min-width: 160px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .pill.green { background: var(--green-bg); color: var(--green); }
  .pill.amber { background: var(--amber-bg); color: var(--amber); }
  .pill.gray { background: var(--bg); color: var(--muted); }
  .empty { color: var(--muted); padding: 8px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td small { color: var(--muted); display: block; }
  .scroll { overflow-x: auto; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 12px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; display: none; z-index: 10; max-width: 90vw; }
  #toast.err { background: var(--red); color: #fff; }
  .login { max-width: 360px; margin: 10vh auto; }
  .login input { width: 100%; margin-bottom: 10px; }
  .login button { width: 100%; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px; }
  .checks label { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 13px; cursor: pointer; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--bg); }
  .detail td { background: var(--bg); white-space: normal; }
  input, select { font-size: 16px; } /* stops phones zooming in on tap */
  header { padding-top: max(10px, env(safe-area-inset-top)); }
  @media (max-width: 520px) {
    header .sub { order: 3; width: 100%; margin: 0; }
    header button.btn.small { padding: 5px 8px; }
    main { padding: 10px 12px 40px; } nav { padding: 8px 12px 0; }
    .card { padding: 14px; }
    .bill button.btn { flex: 1 1 100%; padding: 12px; font-size: 16px; }
  }
  .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .task-tile { display: flex; align-items: center; gap: 8px; text-align: left; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; min-height: 52px; }
  .task-tile.on { border-color: var(--green); background: var(--green-bg); }
  .card.now { border-color: #d29922; }
  .bill-tile { border-color: var(--primary); }
  .bill-tile.on { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }
  .bill-tile.on .code { background: var(--primary-text); color: var(--primary); }
  .count { background: var(--red); color: #fff; border-radius: 99px; min-width: 24px; height: 24px; display: inline-grid; place-items: center; font-size: 13px; padding: 0 6px; }
  .billsearch { width: 100%; margin-bottom: 4px; }
  .bill[hidden] { display: none; }
  .stage-panel { border: 2px solid var(--primary); }
  .card.fix { border-color: var(--red); background: var(--red-bg); }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString([], { day: '2-digit', month: 'short' }) : '';
const fmtFull = (iso) => iso ? fmtDate(iso) + ' ' + fmtTime(iso) : '';
function dur(a, b) {
  if (a == null || b == null || a === '' || b === '') return '';
  const m = Math.round((new Date(b) - new Date(a)) / 60000);
  return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
}
const ago = (iso) => dur(iso, new Date().toISOString()) || '0m';

let state = { me: null, tasks: [], tab: 'other' };
let refreshTimer = null;

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), 2500);
}
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && url !== '/api/login') { state.me = null; render(); throw new Error('Please log in'); }
  if (!r.ok) throw new Error(data.error || 'Error');
  return data;
}
async function act(btn, fn, okMsg) {
  if (btn) btn.disabled = true;
  try { await fn(); if (okMsg) toast(okMsg); await loadTab(); }
  catch (e) { toast(e.message, true); }
  finally { if (btn) btn.disabled = false; }
}

// ---------- login ----------
function renderLogin() {
  $('#app').innerHTML = `
    <div class="card login">
      <h2>Shop Bill Tracker</h2><p class="sub">Log in with your ID</p>
      <form id="lf"><input name="u" placeholder="Username" autocapitalize="off" autocomplete="username" value="${esc(new URLSearchParams(location.search).get('u') || '')}">
      <input name="p" type="password" placeholder="Password" autocomplete="current-password"><button class="btn">Log in</button></form>
    </div>`;
  { const f = $('#lf'); (f.u.value ? f.p : f.u).focus(); }
  $('#lf').onsubmit = async (e) => {
    e.preventDefault();
    try { await api('POST', '/api/login', { username: e.target.u.value, password: e.target.p.value }); await boot(); }
    catch (err) { toast(err.message, true); }
  };
}

// ---------- shell ----------
function tabs() {
  const t = [['other', 'Work']];
  if (state.me.is_admin || state.me.is_manager) t.push(['all', 'All Bills'], ['otherlog', 'Task Log'], ['fixes', 'Fix Requests']);
  if (state.me.is_admin) t.push(['staff', 'Staff'], ['codes', 'Task Codes']);
  return t;
}
function render() {
  clearInterval(refreshTimer);
  if (!state.me) return renderLogin();
  const myCodes = state.me.is_admin ? 'Owner' : [state.me.is_manager ? 'Manager' : '', ...state.me.tasks].filter(Boolean).join(', ');
  $('#app').innerHTML = `
    <header><h1>Bill Tracker</h1>
      <span class="sub" style="margin:0">${esc(state.me.name)}${myCodes ? " · " + esc(myCodes) : ""}</span>
      <button class="btn ghost small" id="pw">Password</button>
      <button class="btn ghost small" id="lo">Log out</button></header>
    <nav>${tabs().map(([k, l]) => `<button data-tab="${k}" class="${state.tab === k ? 'on' : ''}">${l}</button>`).join('')}</nav>
    <main><div id="fixbar"></div><div id="main"></div></main>`;
  $('nav').onclick = (e) => { const k = e.target.dataset.tab; if (k) { state.tab = k; render(); } };
  $('#lo').onclick = async () => { await api('POST', '/api/logout'); state.me = null; render(); };
  $('#pw').onclick = changePassword;
  loadTab();
  if (['all', 'other'].includes(state.tab)) refreshTimer = setInterval(() => { if (!document.querySelector('input:focus')) loadTab(); }, 15000);
}
async function changePassword() {
  const oldPassword = prompt('Current password'); if (oldPassword == null) return;
  const newPassword = prompt('New password (at least 4 characters)'); if (!newPassword) return;
  try { await api('POST', '/api/password', { oldPassword, newPassword }); toast('Password changed'); } catch (e) { toast(e.message, true); }
}
async function loadTab() {
  const m = $('#main'); if (!m) return;
  try {
    await ({ other: viewOther, all: viewAll, otherlog: viewTaskLog, fixes: viewFixes, staff: viewStaff, codes: viewCodes }[state.tab])(m);
    if (!state.me.is_admin && !state.me.is_manager) await fixBar();
  }
  catch (e) { toast(e.message, true); }
}

// ---------- Work screen: bill steps + work tasks A-U ----------
function stageCard(task, bills, allStages, busy) {
  const isFirst = task.stage_order === allStages[0].stage_order;
  const prev = allStages[allStages.findIndex((t) => t.code === task.code) - 1];
  const rows = bills.map((b) => {
    const e = b.stages[task.code];
    const p = prev && b.stages[prev.code];
    let info, btn;
    if (task.kind === 'single') {
      info = p ? `${esc(prev.name)} done by ${esc(p.end_by_name)} at ${fmtTime(p.end_at)} · waiting ${ago(p.end_at)}` : '';
      btn = `<button class="btn green" data-a="done" data-b="${b.id}" data-t="${task.code}">${task.code === 'FR' ? 'Final Ready' : task.code === 'PK' ? 'Packed now' : 'Done now'}</button>`;
    } else if (e && e.start_at) {
      info = `<span class="pill amber">In progress</span> Started by ${esc(e.start_by_name)} at ${fmtTime(e.start_at)} · ${ago(e.start_at)}`;
      btn = `<button class="btn amber" data-a="end" data-b="${b.id}" data-t="${task.code}">End</button>`;
    } else {
      info = `<span class="pill gray">To do</span> ${p ? `${esc(prev.name)} by ${esc(p.end_by_name)}, finished ${fmtTime(p.end_at)} · waiting ${ago(p.end_at)}` : ''}`;
      btn = busy ? '' : `<button class="btn" data-a="start" data-b="${b.id}" data-t="${task.code}">Start</button>`;
    }
    return `<div class="bill" data-no="${esc(b.bill_no.toUpperCase())}"><div class="no">#${esc(b.bill_no)}</div><div class="info">${info}</div>${btn}</div>`;
  }).join('');
  return `<section class="card stage-panel">
    <h2><span class="code">${task.code}</span>${esc(task.name)}</h2>
    <p class="sub">${task.kind === 'single' ? 'Find the bill and tap the button. It records the current time.' : isFirst ? 'Type the bill number and press Start. Press End when you finish.' : 'Find the bill, press Start when you begin and End when you finish.'}</p>
    ${isFirst ? `<form class="row newbill" style="margin-bottom:8px"><input name="no" class="grow billno" placeholder="Bill T050810 or challan CA007536" maxlength="8" autocapitalize="characters" autocomplete="off" required><button class="btn">Start</button></form>`
      : `<input id="billsearch" class="billsearch" placeholder="Find bill or challan no." value="${esc(filters.queue || '')}" autocapitalize="characters" autocomplete="off">`}
    ${rows || `<p class="empty">${isFirst ? 'No bill in progress.' : 'Nothing waiting right now.'}</p>`}
  </section>`;
}
async function viewOther(m) {
  const [{ rows, busy }, queues] = await Promise.all([api('GET', '/api/work'), state.me.tasks.length || state.me.is_admin ? api('GET', '/api/queue') : []]);
  const allStages = state.tasks.filter((t) => t.stage_order != null);
  const running = rows.find((r) => !r.end_at);
  if (state.openStage && !queues.some((q) => q.task.code === state.openStage)) state.openStage = null;
  const open = queues.find((q) => q.task.code === state.openStage);
  const now = busy
    ? `<section class="card now"><div class="row"><span class="code">${busy.task_code}</span><div class="grow"><b>${esc(busy.task_name)} · Bill ${esc(busy.bill_no)}</b><div class="sub" style="margin:0">Started ${fmtTime(busy.start_at)} · ${ago(busy.start_at)}</div></div><button class="btn amber" data-a="end" data-b="${busy.bill_id}" data-t="${busy.task_code}">End</button></div></section>`
    : running ? `<section class="card now"><div class="row"><span class="code">${running.task_code}</span><div class="grow"><b>${esc(running.task_name)}</b><div class="sub" style="margin:0">Started ${fmtTime(running.start_at)} · ${ago(running.start_at)}</div></div><button class="btn amber" data-id="${running.id}">End</button></div></section>` : '';
  const billTiles = queues.map(({ task, bills }) => `<button class="task-tile bill-tile${state.openStage === task.code ? ' on' : ''}" data-stage="${task.code}"><span class="code">${task.code}</span><span class="grow">${esc(task.name)}</span>${bills.length ? `<span class="count">${bills.length}</span>` : ''}</button>`).join('');
  const tiles = state.tasks.filter((t) => t.stage_order == null).map((t) => `<button class="task-tile${running && running.task_code === t.code ? ' on' : ''}" data-code="${t.code}" ${running && running.task_code === t.code ? 'disabled' : ''}><span class="code">${t.code}</span><span>${esc(t.name)}</span></button>`).join('');
  m.innerHTML = `${now}
    ${queues.length ? `<section class="card"><h2>Bill work</h2><p class="sub">Tap your bill step.</p><div class="task-grid">${billTiles}</div></section>${open ? stageCard(open.task, open.bills, allStages, busy) : ''}` : ''}
    <section class="card"><h2>${queues.length ? 'Other work' : 'What are you doing now?'}</h2><p class="sub">Tap a task to start it. Tapping another task ends the current one.</p>
    ${busy ? `<p class="pill amber" style="margin-bottom:10px">Finish bill ${esc(busy.bill_no)} first</p>` : ''}<div class="task-grid"${busy ? ' style="opacity:.45;pointer-events:none"' : ''}>${tiles}</div></section>
    <section class="card"><h2>My recent tasks</h2>${rows.length ? `<div class="scroll"><table><tr><th>Task</th><th>Start</th><th>End</th><th>Time</th></tr>
    ${rows.map((r) => `<tr><td><b>${r.task_code}</b> ${esc(r.task_name)}</td><td>${fmtFull(r.start_at)}</td><td>${r.end_at ? fmtTime(r.end_at) : '<span class="pill amber">Running</span>'}</td><td>${dur(r.start_at, r.end_at)}</td></tr>`).join('')}</table></div>` : '<p class="empty">No tasks yet.</p>'}</section>`;
  m.querySelectorAll('form.newbill').forEach((f) => f.onsubmit = (e) => {
    e.preventDefault();
    const no = f.no.value.trim().toUpperCase();
    if (!/^([TR]\d{6}|[A-Z]{2}\d{6})$/.test(no)) return toast('Use a bill no. like T050810 or a challan no. like CA007536', true);
    act(f.querySelector('button'), () => api('POST', '/api/bills', { bill_no: no }), `${/^[A-Z]{2}/.test(no) ? 'Challan' : 'Bill'} ${no} started`);
  });
  m.querySelectorAll('input.billno').forEach((i) => i.oninput = () => { i.value = i.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
  const search = $('#billsearch');
  if (search) {
    const filter = () => {
      const q = search.value.trim().toUpperCase(); filters.queue = q;
      m.querySelectorAll('.stage-panel .bill').forEach((el) => { el.hidden = q && !el.dataset.no.includes(q); });
    };
    search.oninput = filter; filter();
  }
  m.onclick = (e) => {
    const st = e.target.closest('button[data-stage]');
    if (st) { state.openStage = state.openStage === st.dataset.stage ? null : st.dataset.stage; filters.queue = ''; return loadTab(); }
    const a = e.target.closest('button[data-a]');
    if (a) {
      const label = { start: 'Started', end: 'Ended', done: 'Marked' }[a.dataset.a];
      return act(a, () => api('POST', '/api/stage', { bill_id: +a.dataset.b, task_code: a.dataset.t, action: a.dataset.a }), label + ' at ' + fmtTime(new Date().toISOString()));
    }
    const c = e.target.closest('button[data-code]');
    if (c) return act(c, () => api('POST', '/api/work', { action: 'start', task_code: c.dataset.code }), `Started ${c.dataset.code}`);
    const d = e.target.closest('button[data-id]');
    if (d) return act(d, () => api('POST', '/api/work', { action: 'end', id: +d.dataset.id }), 'Ended');
  };
}

// ---------- Owner: all bills ----------
let filters = { day: new Date().toLocaleDateString('en-CA'), search: '', open: null, queue: '' };
function dayRange(day) {
  if (!day) return {};
  const from = new Date(day + 'T00:00:00'); const to = new Date(from); to.setDate(to.getDate() + 1);
  return { from: from.toISOString(), to: to.toISOString() };
}
async function viewAll(m) {
  const { from, to } = dayRange(filters.day);
  const q = new URLSearchParams({ ...(from && { from, to }), ...(filters.search && { search: filters.search }) });
  const { stages, bills } = await api('GET', '/api/admin/bills?' + q);
  const done = bills.filter((b) => b.current === 'DONE');
  const avg = (code) => {
    const d = bills.map((b) => b.stages[code]).filter((e) => e && e.start_at && e.end_at).map((e) => new Date(e.end_at) - new Date(e.start_at));
    return d.length ? dur(0, d.reduce((a, b) => a + b, 0) / d.length) : '–';
  };
  const avgTotal = done.length ? dur(0, done.reduce((a, b) => a + (new Date(b.stages[stages.at(-1).code].end_at) - new Date(b.created_at)), 0) / done.length) : '–';
  const name = (c) => stages.find((s) => s.code === c)?.name || c;
  m.innerHTML = `
    <div class="card row"><input type="date" id="fd" value="${filters.day}"><button class="btn ghost small" id="fall">All dates</button>
      <input id="fs" class="grow" placeholder="Search bill number" value="${esc(filters.search)}"><button class="btn ghost small" id="csv">Download CSV</button></div>
    <div class="stats">
      <div class="stat"><b>${bills.length}</b><span>Bills</span></div>
      <div class="stat"><b>${done.length}</b><span>Final ready</span></div>
      ${stages.filter((s) => s.kind === 'startend').map((s) => `<div class="stat"><b>${avg(s.code)}</b><span>Avg ${s.code} ${esc(s.name)}</span></div>`).join('')}
      <div class="stat"><b>${avgTotal}</b><span>Avg start to final ready</span></div>
    </div>
    <div class="card scroll"><table>
      <tr><th>Bill</th>${stages.map((s) => `<th>${s.code} · ${esc(s.name)}</th>`).join('')}<th>Total</th><th>Status</th></tr>
      ${bills.map((b) => {
        const cells = stages.map((s) => {
          const e = b.stages[s.code];
          if (!e) return '<td></td>';
          if (s.kind === 'single') return `<td>${fmtTime(e.end_at)}<small>${esc(e.end_by_name)}</small></td>`;
          const by = e.end_by && e.end_by !== e.start_by ? `${esc(e.start_by_name)} / ${esc(e.end_by_name)}` : esc(e.start_by_name);
          return `<td>${fmtTime(e.start_at)} – ${e.end_at ? fmtTime(e.end_at) : '…'}<small>${e.end_at ? dur(e.start_at, e.end_at) + ' · ' : ''}${by}</small></td>`;
        }).join('');
        const last = b.stages[stages.at(-1).code];
        const status = b.current === 'DONE' ? '<span class="pill green">Ready</span>' : `<span class="pill amber">At ${b.current} ${esc(name(b.current))}</span>`;
        const done = stages.filter((s) => b.stages[s.code]);
        const detail = filters.open === b.id ? `<tr class="detail"><td colspan="${stages.length + 3}">
          Bill #${esc(b.bill_no)} created ${fmtFull(b.created_at)} by ${esc(b.created_by_name)}. Ask the person to fix a wrong punch:
          <div class="row" style="margin-top:8px">${done.map((s) => { const e = b.stages[s.code]; return `<button class="btn ghost small" data-fix="${e.id}" data-who="${esc(e.start_by_name || e.end_by_name)}">Ask ${esc(e.start_by_name || e.end_by_name)} to fix ${s.code}</button>`; }).join('')}</div>
          ${state.me.is_admin ? `<p class="sub" style="margin:10px 0 0">Owner: undo a stage (this also clears the stages after it):</p>
          <div class="row" style="margin-top:6px">${done.map((s) => `<button class="btn ghost small" data-reset="${s.code}" data-b="${b.id}">Undo ${s.code}${s === stages[0] ? ' (delete bill)' : ''}</button>`).join('')}</div>` : ''}</td></tr>` : '';
        return `<tr class="click" data-open="${b.id}"><td><b>#${esc(b.bill_no)}</b><small>${fmtDate(b.created_at)}</small></td>${cells}<td>${last && last.end_at ? dur(b.created_at, last.end_at) : ''}</td><td>${status}</td></tr>${detail}`;
      }).join('') || `<tr><td colspan="${stages.length + 3}" class="empty">No bills for this day.</td></tr>`}
    </table></div>`;
  $('#fd').onchange = (e) => { filters.day = e.target.value; loadTab(); };
  $('#fall').onclick = () => { filters.day = ''; loadTab(); };
  $('#fs').onchange = (e) => { filters.search = e.target.value.trim(); loadTab(); };
  $('#csv').onclick = () => downloadCsv(stages, bills);
  m.onclick = (e) => {
    const fx = e.target.closest('button[data-fix]');
    if (fx) return askFix(fx);
    const r = e.target.closest('button[data-reset]');
    if (r) {
      if (!confirm(`Undo stage ${r.dataset.reset} for this bill?`)) return;
      return act(r, () => api('POST', '/api/admin/reset-stage', { bill_id: +r.dataset.b, task_code: r.dataset.reset }), 'Undone');
    }
    const tr = e.target.closest('tr[data-open]');
    if (tr) { filters.open = filters.open === +tr.dataset.open ? null : +tr.dataset.open; loadTab(); }
  };
}
function downloadCsv(stages, bills) {
  const head = ['Bill No', 'Created'];
  stages.forEach((s) => s.kind === 'single' ? head.push(`${s.code} Time`, `${s.code} By`) : head.push(`${s.code} Start`, `${s.code} End`, `${s.code} Minutes`, `${s.code} By`));
  const lines = [head];
  for (const b of bills) {
    const row = [b.bill_no, fmtFull(b.created_at)];
    for (const s of stages) {
      const e = b.stages[s.code] || {};
      if (s.kind === 'single') row.push(fmtFull(e.end_at), e.end_by_name || '');
      else row.push(fmtFull(e.start_at), fmtFull(e.end_at), e.start_at && e.end_at ? Math.round((new Date(e.end_at) - new Date(e.start_at)) / 60000) : '', [e.start_by_name, e.end_by_name].filter((v, i, a) => v && a.indexOf(v) === i).join(' / '));
    }
    lines.push(row);
  }
  const csv = lines.map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `bills-${filters.day || 'all'}.csv`; a.click();
}

// ---------- Owner: other task log ----------
async function viewTaskLog(m) {
  const { from, to } = dayRange(filters.day);
  const rows = await api('GET', '/api/admin/work?' + new URLSearchParams(from ? { from, to } : {}));
  m.innerHTML = `<div class="card row"><input type="date" id="fd" value="${filters.day}"><button class="btn ghost small" id="fall">All dates</button></div>
    <div class="card scroll"><table><tr><th>Employee</th><th>Task</th><th>Start</th><th>End</th><th>Time</th><th></th></tr>
    ${rows.map((r) => `<tr><td>${esc(r.start_by_name)}</td><td><b>${r.task_code}</b> ${esc(r.task_name)}</td><td>${fmtFull(r.start_at)}</td><td>${r.end_at ? fmtTime(r.end_at) : `<span class="pill amber">Running ${ago(r.start_at)}</span>`}</td><td>${dur(r.start_at, r.end_at)}</td><td><button class="btn ghost small" data-fix="${r.id}" data-who="${esc(r.start_by_name)}">Ask to fix</button></td></tr>`).join('') || '<tr><td colspan="6" class="empty">Nothing logged.</td></tr>'}
    </table></div>`;
  m.onclick = (e) => { const fx = e.target.closest('button[data-fix]'); if (fx) askFix(fx); };
  $('#fd').onchange = (e) => { filters.day = e.target.value; loadTab(); };
  $('#fall').onclick = () => { filters.day = ''; loadTab(); };
}

// ---------- Fix requests ----------
function askFix(btn) {
  const message = prompt(`What should ${btn.dataset.who} fix?`, 'Wrong time punched, please correct');
  if (!message) return;
  act(btn, () => api('POST', '/api/fixes', { entry_id: +btn.dataset.fix, message }), `Sent to ${btn.dataset.who}`);
}
async function viewFixes(m) {
  const rows = await api('GET', '/api/fixes');
  m.innerHTML = `<section class="card"><h2>Fix requests</h2><p class="sub">Ask from All Bills (tap a bill) or Task Log. The person sees the request when they open the app.</p>
    ${rows.map((f) => `<div class="bill"><div class="info" style="color:var(--text)"><b>${esc(f.employee_name)}</b> · ${esc(f.what)}
      <div class="sub" style="margin:2px 0">"${esc(f.message)}" · asked by ${esc(f.created_by_name)}, ${fmtFull(f.created_at)}</div>
      ${f.resolved_at ? `<span class="pill green">Fixed</span> <small class="sub">${esc(f.resolved_by_name)}, ${fmtFull(f.resolved_at)}${f.reply ? ': ' + esc(f.reply) : ''}</small>` : '<span class="pill amber">Waiting</span>'}</div>
      ${f.resolved_at ? '' : `<button class="btn ghost small" data-close="${f.id}">Close</button>`}</div>`).join('') || '<p class="empty">No requests yet.</p>'}
    </section>`;
  m.onclick = (e) => { const c = e.target.closest('button[data-close]'); if (c) act(c, () => api('POST', '/api/fixes/done', { id: +c.dataset.close }), 'Closed'); };
}
async function fixBar() {
  const bar = $('#fixbar'); if (!bar) return;
  const open = (await api('GET', '/api/fixes')).filter((f) => !f.resolved_at);
  bar.innerHTML = open.map((f) => `<section class="card fix"><b>${esc(f.created_by_name)} asked you to fix: ${esc(f.what)}</b>
    <p class="sub" style="margin:4px 0 10px">${esc(f.message)} · ${fmtFull(f.created_at)}</p>
    <button class="btn green small" data-done="${f.id}">I have fixed it</button></section>`).join('');
  bar.onclick = (e) => {
    const b = e.target.closest('button[data-done]'); if (!b) return;
    const reply = prompt('What did you correct? (optional)', '');
    if (reply === null) return;
    act(b, () => api('POST', '/api/fixes/done', { id: +b.dataset.done, reply }), 'Thanks, marked fixed');
  };
}

// ---------- Owner: staff ----------
async function viewStaff(m) {
  const users = await api('GET', '/api/admin/users');
  const stageCodes = state.tasks.filter((t) => t.stage_order != null);
  const form = (u = {}) => `<form class="card" data-id="${u.id || ''}">
      <div class="row"><input name="username" placeholder="Username" value="${esc(u.username)}" ${u.id ? 'disabled' : ''}>
        <input name="name" placeholder="Full name" value="${esc(u.name)}"><input name="password" placeholder="${u.id ? 'New password (leave blank to keep)' : 'Password'}"></div>
      <p class="sub" style="margin:10px 0 6px">Bill stages this person can do</p>
      <div class="checks">${stageCodes.map((t) => `<label><input type="checkbox" name="t" value="${t.code}" ${(u.tasks || []).includes(t.code) ? 'checked' : ''}> ${t.code} ${esc(t.name)}</label>`).join('')}</div>
      <div class="row" style="margin-top:10px"><label><input type="checkbox" name="admin" ${u.is_admin ? 'checked' : ''}> Owner access</label><label><input type="checkbox" name="manager" ${u.is_manager ? 'checked' : ''}> Manager</label>
        ${u.id ? `<label><input type="checkbox" name="active" ${u.active ? 'checked' : ''}> Active</label>` : ''}<span class="grow"></span><button class="btn small">${u.id ? 'Save' : 'Add employee'}</button></div>
    </form>`;
  m.innerHTML = `<h3>Add employee</h3>${form()}<h3>Employees</h3>${users.map(form).join('')}`;
  m.querySelectorAll('form').forEach((f) => f.onsubmit = (e) => {
    e.preventDefault();
    const body = { id: +f.dataset.id || undefined, username: f.username.value, name: f.name.value, password: f.password.value,
      tasks: [...f.querySelectorAll('input[name=t]:checked')].map((c) => c.value), is_admin: f.admin.checked, is_manager: f.manager.checked, active: f.active ? f.active.checked : true };
    act(f.querySelector('button'), () => api('POST', '/api/admin/users', body), 'Saved');
  });
}

// ---------- Owner: task codes ----------
async function viewCodes(m) {
  m.innerHTML = `<section class="card"><h2>Add or rename a task code</h2><p class="sub">Employees can log these from Other Tasks.</p>
    <form class="row" id="cf"><input name="code" placeholder="Code e.g. T" style="width:110px"><input name="name" class="grow" placeholder="Task name">
    <select name="kind"><option value="startend">Start + End</option><option value="single">One tap</option></select><button class="btn">Save</button></form></section>
    <section class="card scroll"><table><tr><th>Code</th><th>Task</th><th>Buttons</th><th>Bill stage</th></tr>
    ${state.tasks.map((t) => `<tr><td><span class="code">${t.code}</span></td><td>${esc(t.name)}</td><td>${t.kind === 'single' ? 'One tap' : 'Start + End'}</td><td>${t.stage_order ? 'Step ' + t.stage_order : ''}</td></tr>`).join('')}
    </table></section>`;
  $('#cf').onsubmit = (e) => {
    e.preventDefault(); const f = e.target;
    act(f.querySelector('button'), async () => { await api('POST', '/api/admin/tasks', { code: f.code.value, name: f.name.value, kind: f.kind.value }); state.tasks = (await api('GET', '/api/me')).tasks; }, 'Saved');
  };
}

async function boot() {
  try { const r = await api('GET', '/api/me'); state.me = r.user; state.tasks = r.tasks; state.tab = r.user.is_admin || r.user.is_manager ? 'all' : 'other'; }
  catch { state.me = null; }
  render();
}
boot();
</script>
</body>
