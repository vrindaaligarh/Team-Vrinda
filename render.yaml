services:
  - type: web
    name: bill-tracker
    runtime: node
    plan: starter
    region: singapore
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DB_FILE
        value: /var/data/shop.db
    disk:
      name: bill-data
      mountPath: /var/data
      sizeGB: 1
